  function parsedLoanTerms(p,r,d,unit,technique) {
    const principal=parseFixed2(p,MAX_AMOUNT),rate=parseFixed2(r,MAX_RATE,true),value=parseFixed2(d,unit==='years'?3000:MAX_MONTHS);
    if(principal===null||rate===null||value===null||!['months','years'].includes(unit)||!['daily','weekly','monthly'].includes(technique))return null;
    const months=unit==='years'?value*12:value;if(months>MAX_MONTHS)return null;
    const interest=interestFor(principal,rate,months),total=principal+interest;
    return {principal,rate,value,unit,months,interest,total,technique};
  }
  function loanCalculator(p,r,d,unit,technique) {
    const terms=parsedLoanTerms(p,r,d,unit,technique);
    if(!terms)return `<div class="calc-label">Estimated total repayment</div><div class="calc-total">GH₵0.00</div><div class="calc-caption">Enter all terms to preview the split.</div><div class="calc-lines"><div class="calc-line"><span>Principal amount</span><strong>—</strong></div><div class="calc-line"><span>Total interest</span><strong>—</strong></div><div class="calc-line"><span>Installments</span><strong>—</strong></div><div class="calc-line"><span>Amount per interval</span><strong>—</strong></div></div><p class="calc-note">Simple interest = principal × annual rate × term in years. Dates are previewed from today and finalised on approval.</p>`;
    let plan;try{plan=planFor(terms.total,terms.months,technique,todayGhana());}catch(error){return `<div class="calc-label">Estimated total repayment</div><div class="calc-total">${esc(money(terms.total))}</div><div class="calc-caption">${esc(error.message)}</div>`;}
    const split=plan.remainder?`${money(plan.base)}–${money(plan.base+1)}`:money(plan.base);
    const remainderNote=plan.remainder?`${plan.remainder} installment${plan.remainder===1?'':'s'} of ${money(plan.base+1)} and ${plan.count-plan.remainder} of ${money(plan.base)}. Pesewa rounding is spread as evenly as possible.`:'Every installment is exactly the same amount.';
    const termDays=Math.round((isoMs(plan.end)-isoMs(todayGhana()))/86400000);
    const partial=(technique==='weekly'&&termDays%7!==0)||(technique==='monthly'&&terms.months%100!==0);
    const intervalNote=partial?'A shorter final interval is included.':'Installments run through the final term date.';
    return `<div class="calc-label">Estimated total repayment</div><div class="calc-total">${esc(money(terms.total))}</div><div class="calc-caption">Principal + simple annual interest</div><div class="calc-lines"><div class="calc-line"><span>Principal amount</span><strong>${esc(money(terms.principal))}</strong></div><div class="calc-line"><span>Total interest</span><strong>${esc(money(terms.interest))}</strong></div><div class="calc-line"><span>${esc(frequencyText(technique))} installments</span><strong>${plan.count}</strong></div><div class="calc-line calc-emphasis"><span>Due per ${esc(intervalText(technique))}</span><strong>${esc(split)}</strong></div><div class="calc-line"><span>Estimated final due date</span><strong>${esc(dateOnly(plan.end))}</strong></div></div><p class="calc-note">${esc(remainderNote)} ${esc(intervalNote)} The schedule is recalculated on the approval date.</p>`;
  }
  /* ============================================================

  /* The printed register is set two members to a line and tight, so a full group
     still fits the agreement sheet and the two-sheet application. Ghana Card
     columns stay, because the office checks them against the physical cards. */
  function groupPrintOfficers(group){
    const row=(label,officer)=>`<tr><td class="group-print-role">${esc(label)}</td><td>${esc(officer?.name||'—')}</td><td class="group-print-phone">${esc(officer?.phone||'—')}</td><td class="group-print-card">${esc(officer?.ghanaCard||'—')}</td></tr>`;
    return `<table class="group-print-table group-print-officers" aria-label="Group leader and secretary"><tbody>${row('Group leader',group?.leader)}${row('Secretary / treasurer',group?.secretary)}</tbody></table>`;
  }
  function groupPrintMembers(members,label,{blank=MIN_GROUP_MEMBERS}={}){
    const list=members&&members.length?members:Array.from({length:blank},()=>({name:'',phone:'',ghanaCard:''}));
    /* Two members to a line keeps a full group on the sheet. The columns are
       #, name, phone, Ghana Card, a divider, then the same four again: nine in
       all, so a lone last member can spread across the whole line instead of
       leaving four empty boxes beside it. */
    const cell=(member,number)=>`<td class="group-print-index">${number}</td><td>${esc(member.name||'')}</td><td class="group-print-phone">${esc(member.phone||'')}</td><td class="group-print-card">${esc(member.ghanaCard||'')}</td>`;
    /* A lone last member keeps the column it would have had, and the rest of the
       line is left blank, with no ruling, instead of four empty boxes. */
    const lone=(member,number)=>`<td class="group-print-index">${number}</td><td>${esc(member.name||'')}</td><td class="group-print-phone">${esc(member.phone||'')}</td><td class="group-print-card">${esc(member.ghanaCard||'')}</td><td class="group-print-tail" colspan="5"></td>`;
    const rows=[];
    for(let index=0;index<list.length;index+=2){
      const left=list[index],right=list[index+1];
      rows.push(right?`<tr>${cell(left,index+1)}<td class="group-print-divider"></td>${cell(right,index+2)}</tr>`:`<tr>${lone(left,index+1)}</tr>`);
    }
    const rowCount=rows.length;
    const sizeClass=rowCount<=2?'':rowCount<=3?' is-airy':rowCount<=4?' is-roomy':rowCount<=5?' is-mid':rowCount<=6?' is-tight':rowCount<=7?' is-dense':' is-packed';
    /* Column widths belong on the columns, not on the cells: the table uses a
       fixed layout, so the number column can stay narrow while the name column
       keeps most of the room. */
    const cols=`<colgroup>${['index','name','phone','card','divider','index','name','phone','card'].map(kind=>`<col class="group-print-col-${kind}">`).join('')}</colgroup>`;
    return `<table class="group-print-table group-print-members${sizeClass}" aria-label="${esc(label)}">${cols}<thead><tr><th>#</th><th>Full name</th><th>Phone</th><th>Ghana Card</th><th class="group-print-divider"></th><th>#</th><th>Full name</th><th>Phone</th><th>Ghana Card</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }

  /* One place decides whether a group register is complete. It returns a plain
     message and the field that owns the problem, so the form can point at it. */
  function validateGroupRegister(group){
    const checks=[
      ['leader',group?.leader,'Group leader'],
      ['secretary',group?.secretary,'Secretary / treasurer']
    ];
    for(const [role,officer,title] of checks){
      const name=String(officer?.name||'').trim(),phone=String(officer?.phone||'').trim(),card=String(officer?.ghanaCard||'').trim();
      if(!name) return {target:`group-${role}-name`,message:`Enter the ${title.toLowerCase()}'s full name.`};
      if(name.length>MAX_GROUP_NAME) return {target:`group-${role}-name`,message:`The ${title.toLowerCase()}'s name is too long.`};
      if(!isLocalPhone(phone)) return {target:`group-${role}-phone`,message:`Enter the ${title.toLowerCase()}'s 10-digit phone number, for example 0241234567.`};
      if(card && !/^GHA-\d{9}-\d$/.test(card)) return {target:`group-${role}-ghanaCard`,message:`The ${title.toLowerCase()}'s Ghana Card must look like GHA-123456789-0.`};
    }
    const members=Array.isArray(group?.members)?group.members:[];
    if(members.length<MIN_GROUP_MEMBERS) return {target:'group-members',message:`A group needs at least ${MIN_GROUP_MEMBERS} members. Add ${MIN_GROUP_MEMBERS-members.length} more.`};
    if(members.length>MAX_GROUP_MEMBERS) return {target:'group-members',message:`A group can hold at most ${MAX_GROUP_MEMBERS} members.`};
    const seen=new Set();
    for(const [index,member] of members.entries()){
      const name=String(member?.name||'').trim(),phone=String(member?.phone||'').trim(),card=String(member?.ghanaCard||'').trim();
      const row=`group-member-${index}`;
      if(!name) return {target:`${row}-name`,message:`Enter the name of member ${index+1}.`};
      if(name.length>MAX_GROUP_NAME) return {target:`${row}-name`,message:`Member ${index+1}'s name is too long.`};
      if(!isLocalPhone(phone)) return {target:`${row}-phone`,message:`Enter member ${index+1}'s 10-digit phone number.`};
      if(card && !/^GHA-\d{9}-\d$/.test(card)) return {target:`${row}-ghanaCard`,message:`Member ${index+1}'s Ghana Card must look like GHA-123456789-0.`};
      if(seen.has(phone)) return {target:`${row}-phone`,message:`Member ${index+1} has the same phone number as another member.`};
      seen.add(phone);
    }
    return null;
  }

  function validateStoredLoanProduct(loan){

    if(loan?.group!==undefined && loan?.group!==null){
      if(!key||!isGroupProduct(key)) throw new Error('Only a group loan can carry a group register.');
      if(validateGroupRegister(loan.group)) throw new Error('A group register in this workspace is incomplete.');
    }
    return loan;
  }

  /* Money in words, for the one printed line that asks for it. Whole cedis and
     pesewas only; nothing here touches a floating-point number. */
  const NUMBER_SCALES=Object.freeze([[1000000000000n,'trillion'],[1000000000n,'billion'],[1000000n,'million'],[1000n,'thousand']]);
  const NUMBER_TENS=Object.freeze(['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety']);
  const NUMBER_TEENS=Object.freeze(['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen']);
  const NUMBER_UNITS=Object.freeze(['','one','two','three','four','five','six','seven','eight','nine']);
  function wordsUnder100(value){
    const n=Number(value);
    if(n<10)return NUMBER_UNITS[n];
    if(n<20)return NUMBER_TEENS[n-10];
    const tens=Math.floor(n/10),unit=n%10;
    return NUMBER_TENS[tens]+(unit?'-'+NUMBER_UNITS[unit]:'');
  }
  function wordsUnder1000(value){
    const n=Number(value),hundreds=Math.floor(n/100),rest=n%100;
    return [hundreds?`${NUMBER_UNITS[hundreds]} hundred`:'',rest?wordsUnder100(rest):''].filter(Boolean).join(' and ');
  }
  function numberWords(value){
    let n=BigInt(value);
    if(n===0n)return 'zero';
    const parts=[];
    for(const [scale,name] of NUMBER_SCALES){
      if(n>=scale){const count=n/scale;parts.push(`${numberWords(count)} ${name}`);n%=scale;}
    }
    if(n>0n)parts.push(wordsUnder1000(n));
    return parts.join(' ');
  }
  function amountInWords(pesewas){
    const value=BigInt(Math.trunc(Number(pesewas)||0));
    if(value<=0n)return '';
    const cedis=value/100n,coins=value%100n;
    const head=`${numberWords(cedis)} Ghana ${cedis===1n?'cedi':'cedis'}`;
    return coins?`${head} and ${numberWords(coins)} ${coins===1n?'pesewa':'pesewas'}`:head;
  }

    const format=guide.map(mark=>`<span class="${mark==='/'?'opening-dob-separator':'opening-dob-guide-letter'}">${mark}</span>`).join('');
    const squares=cells.map(mark=>mark==='/'?'<span class="opening-dob-separator">/</span>':`<span class="opening-dob-cell">${esc(mark||'\u00a0')}</span>`).join('');
    const spoken=formatted?`${label}: ${formatted}`:`${label}: eight empty boxes in day, month, year order`;

  }
  function openingDobField(value,required=false){return openingDateField('Date of birth',value,required);}
  function openingChoiceField(label,choices,value='',opts={}){
    const state=openingChoiceState(value,choices,!!opts.multiple);
    const boxes=choices.map(choice=>{
      const checked=state.selected.has(choice);
      return `<span class="opening-choice" role="img" aria-label="${esc(choice)}: ${checked?'selected':'not selected'}"><span class="opening-choice-square${checked?' is-checked':''}" aria-hidden="true">${checked?'✓':''}</span><span>${esc(choice)}</span></span>`;
    }).join('');
    // "Other" is a writable box, never a tick. Blank forms show a faint
    // "Other" hint inside the box so handwriting has an obvious place.
    const other=opts.other?`<div class="opening-choice-other"><div class="opening-choice-other-box${state.other?' is-filled':''}" role="img" aria-label="Other: ${state.other?esc(state.other):'write the answer in this box'}">${state.other?esc(state.other):'<span class="opening-choice-other-hint">Other</span>'}</div></div>`:'';
    const note=opts.note?`<span class="opening-legacy-note">${esc(opts.note)}</span>`:'';
    return `<div class="opening-field opening-choice-field${opts.wide?' opening-field-wide':''}${opts.kind?` opening-choice-${esc(opts.kind)}`:''}"><span class="opening-label">${openingLabel(label,opts.required)}${opts.multiple?' (tick all that apply)':''}</span><div class="opening-choice-options">${boxes}</div>${other}${note}</div>`;
  }

  /* ============================================================

  let loanApplicationPrintLoan='', loanApplicationPrintProduct='';
  function loanApplicationHtml(loan=null,c=null,blankProductKey=''){
    const raw=value=>value===null||value===undefined?'':String(value).trim();
    const item=(label,value='',opts={})=>`<div class="opening-field${opts.wide?' opening-field-wide':''}${opts.name?' opening-name-field':''}${opts.amount?' opening-amount-field':''}"><span class="opening-label">${openingLabel(label,opts.required)}</span><div class="opening-box">${raw(value)?esc(raw(value)):'&nbsp;'}</div></div>`;
    const ticks=(label,choices,value='',opts={})=>openingChoiceField(label,choices,value,opts);
    const name=c?fullName(c):'',phones=c?phoneList(c):'';
    /* Everything below comes from the saved loan: the sheet is a copy of the
       app, never a second form with its own questions. */
    const answers=loan&&loan.details?loan.details:{},guarantor=loan&&loan.guarantor?loan.guarantor:{},loanPurpose=loan?String(loan.purpose||'').trim():'';
    /* One form per sub-type. A blank form names its product on the command line,
       a saved loan carries its own. */
    const key=String(loan?.productKey||blankProductKey||'');
    const product=productFor(key),grouped=isGroupProduct(key);
    const form=LOAN_APPLICATION_FORMS[key]||null;

    const productLine=product?`<p class="application-product-line">Loan product <strong>${esc(product.label)}</strong><span>${esc(LOAN_PRODUCTS[product.group].label)} · collected ${esc(frequencyText(product.rhythm).toLowerCase())}</span></p>`:'';
    /* Two sheets only: what the lender needs to decide, nothing the client has
       already given at account opening. */
    const tracker=part=>`<ol class="opening-tracker" aria-label="Sheet ${part} of 2">${['Applicant','Loan request',grouped?'Group register':(form?'Product & guarantor':'Guarantor'),'Declaration & sign-off'].map((label,index)=>{const active=part===1?index<2:index>=2;return `<li class="${active?'is-current':''}"><span>${index+1}</span>${esc(label)}</li>`;}).join('')}</ol>`;
    const header=part=>`<header class="opening-page2-header"><div class="opening-page2-brand">${brandMark}<div><strong>${esc(formTitle)}</strong><small>SANKOFA SAVINGS &amp; LOANS · GHANA</small></div><span>PART ${part} OF 2</span></div>${tracker(part)}<div class="opening-form-grid opening-header-fields">${item('Applicant name',name,{wide:true,name:true,required:true})}${item('Application reference',loan?labelForLoan(loan):'')}${item('Date received',loan?dateOnly(loan.createdAt):'')}</div></header>`;
    const footer=part=>`<footer class="letter-footer"><span>SANKOFA · ${esc(formTitle)}</span><span>PART ${part} OF 2</span></footer>`;
    const signature=label=>`<div class="opening-signature"><span class="opening-label">${esc(label)}</span><div class="opening-sign-line" aria-label="${esc(label)} line"></div>${openingDateField('Date')}</div>`;
    const checks=['Ghana Card checked','Affordability assessed',...(form?form.checks:['Guarantor contacted']),'Terms explained','Approval letter issued'];
    const requested=loan?money(loan.principalPesewas):'';
    const term=loan?termText(loan):'';
    const technique=loan?frequencyText(loan.repaymentTechnique):'';
    const rateText=loan?`${(loan.annualRateHundredths/100).toFixed(2)}%`:'',decision=loan?loan.status==='active'?'Approved':loan.status==='declined'?'Declined':'':'';
    /* The product's own questions, laid out two to a line. */
    const detailFields=form?form.details.fields:null;
    /* Two questions to a line; a wide question gets a line of its own. */
    const answerOf=label=>String(answers[label]??'').trim();
    const field=(label,kind)=>kind==='date'?openingDateField(label,isoFromDisplayDate(answerOf(label))||''):kind==='wide'?item(label,answerOf(label),{wide:true}):item(label,answerOf(label),kind==='amount'?{amount:true}:{});
    const detailRows=detailFields?(()=>{const rows=[];let pending=[];for(const [label,kind] of detailFields){if(kind==='wide'){if(pending.length){rows.push(pending);pending=[];}rows.push([[label,kind]]);}else{pending.push([label,kind]);if(pending.length===2){rows.push(pending);pending=[];}}}if(pending.length)rows.push(pending);return rows;})():[];
    const detailsBlock=detailFields?`<section class="opening-section application-details"><h3 class="opening-heading"><span class="opening-step">03</span>${esc(form.details.heading)}</h3>${detailRows.map(row=>`<div class="opening-form-grid${row.length>1?' opening-row-pair':''}">${row.map(([label,kind])=>field(label,kind)).join('')}</div>`).join('')}</section>`:'';
    const purposes=form?form.purpose:['Business capital','School fees','Medical','Housing / rent','Farming inputs','Transport','Stock purchase'];
    const secondStepNumber=grouped||!form?'04':'04';
    return `<div class="opening-document opening-four-sheet loan-application-document">

        <div class="opening-page-content">
          <section class="opening-section"><h3 class="opening-heading"><span class="opening-step">01</span>Applicant</h3>
            <div class="opening-form-grid opening-name-grid">${item('First name',c?.firstName,{required:true})}${item('Surname',c?.surname,{required:true})}${item('Other name',c?.otherName)}</div>
            <div class="opening-form-grid opening-row-pair">${item('Ghana Card number',c?.ghanaCard,{required:true})}${item('Mobile number(s)',phones,{required:true})}</div>
            <div class="opening-form-grid opening-row-pair">${item('Occupation',c?.occupation,{required:true})}${item('Employer / business name',c?.employer)}</div>
            <div class="opening-form-grid">${item('Residential address / location',c?.location,{wide:true,required:true})}</div>

            ${productLine}
            ${ticks('Purpose of loan',[...purposes],loanPurpose,{other:true,wide:true,kind:'purpose'})}
            <div class="opening-form-grid opening-row-pair">${ticks('Repayment',['Daily','Weekly','Monthly'],technique,{required:true})}${item('Preferred term',term,{required:true})}</div>
          </section>
          ${detailsBlock}
        </div>${footer(1)}
      </article>
      <article class="letter opening-page opening-sheet opening-sheet-2 loan-application" aria-label="Loan application sheet 2 of 2">
        ${header(2)}
        <div class="opening-page-content">
          ${grouped?applicationGroupBlock(loan):`<section class="opening-section"><h3 class="opening-heading"><span class="opening-step">${secondStepNumber}</span>Guarantor</h3>
            <div class="opening-form-grid">${item('Guarantor full name',guarantor.name,{wide:true,name:true})}</div>
            <div class="opening-form-grid opening-row-pair">${ticks('Relationship',['Parent','Spouse','Child','Sibling','Friend'],guarantor.relationship,{other:true})}${item('Guarantor phone',guarantor.phone)}</div>
            <div class="opening-form-grid">${item('Guarantor Ghana Card number',guarantor.ghanaCard,{wide:true})}</div>
          </section>`}
          <section class="opening-section"><h3 class="opening-heading"><span class="opening-step">05</span>Declaration</h3>
            <div class="opening-declaration-box"><p class="opening-copy">I declare that the information above is true and that I can repay the amount requested on the agreed schedule. I authorise the institution to verify my details with my employer, bank or credit reference sources, and I understand that a loan is granted only when approved in writing.</p></div>
            <div class="opening-signatures">${signature(grouped?'Group leader signature':'Applicant signature')}${signature(grouped?'Secretary / treasurer signature':'Guarantor signature')}</div>

            <div class="opening-checks">${checks.map(text=>`<div class="opening-check"><span class="opening-check-square" aria-hidden="true"></span><span>${esc(text)}</span></div>`).join('')}</div>
            <div class="opening-form-grid opening-row-pair">${ticks('Decision',['Approved','Approved with conditions','Referred','Declined'],decision)}${item('Approved amount (GH₵)',loan&&loan.status==='active'?requested:'',{amount:true})}</div>
            <div class="opening-form-grid opening-row-pair">${item('Interest rate (% per year)',loan&&loan.status==='active'?rateText:'')}${item('Approved term',loan&&loan.status==='active'?term:'')}</div>
            ${loan&&loan.status==='active'?`<div class="opening-form-grid">${item('Repayment starts',loan.scheduleStartDate?dateOnly(loan.scheduleStartDate):'',{wide:true})}</div>`:''}
            <div class="opening-form-grid opening-row-pair">${item('Officer name',loan&&loan.declinedBy?loan.declinedBy:'')}${item('Branch / institution stamp')}</div>
            ${loan&&loan.status==='declined'?`<div class="opening-form-grid">${item('Reason, where declined',loan.declineReason,{wide:true})}</div>`:''}
            <div class="opening-signatures">${signature('Officer signature')}</div>
          </section>
        </div>${footer(2)}
      </article>
    </div>`;
  }
  /* A group application names the officers and lists the members on the sheet the
     guarantor would otherwise use: for a group, the group itself is the security. */
  function applicationGroupBlock(loan){
    const group=loan?.group||{};
    const item=(label,value='',opts={})=>`<div class="opening-field${opts.wide?' opening-field-wide':''}"><span class="opening-label">${openingLabel(label,opts.required)}</span><div class="opening-box">${String(value??'').trim()?esc(String(value).trim()):'&nbsp;'}</div></div>`;
    const members=groupMembersOf(loan).slice(0,MAX_GROUP_MEMBERS);

      <div class="opening-form-grid opening-group-officers">${item('Leader name',group.leader?.name||'',{required:true})}${item('Leader phone',group.leader?.phone||'',{required:true})}${item('Secretary name',group.secretary?.name||'',{required:true})}${item('Secretary phone',group.secretary?.phone||'',{required:true})}</div>

  function showLoanApplication(id='',blankProductKey=''){

    const key=String(loan?.productKey||blankProductKey||''),product=productFor(key);
    loanApplicationPrintLoan=loan?.id||'';loanApplicationPrintProduct=loan?'':key;
    const form=withWatermarks(loanApplicationHtml(loan,c,loan?'':key));
    $('#print-root').innerHTML=form;
    const title=loan?`${product?product.label:'Loan'} application · ${fullName(c)}`:`Blank ${product?product.label:'loan'} application`;
    const subtitle=loan?'Prefilled with the borrower’s registered details and requested terms.':(product?`A two-sheet A4 ${product.label.toLowerCase()} form the applicant completes by hand.`:'A two-sheet A4 form the applicant completes by hand.');
    showModal(title,subtitle,`<p class="opening-preview-hint">Swipe sideways inside the preview to see the entire sheet.</p><div class="agreement-scroll opening-preview" role="region" tabindex="0" aria-label="Loan application preview; scroll to see the entire sheet">${form}</div>`,`${button('close-modal','Close',null,'secondary')}${button('loan-application-print','Print application','print','primary')}`,true);
  }
  /* One blank form per sub-type, listed on the loan book. */

  let blankChooserStep='type',blankChooserGroup='';
  function blankChooserSteps(){
    const step=(number,label,done,current)=>`<span class="blank-step${done?' is-done':''}${current?' is-current':''}"${current?' aria-current="step"':''}><span class="blank-step-number">${done?'✓':number}</span>${esc(label)}</span>`;
    return `<div class="blank-step-bar" aria-label="Step ${blankChooserStep==='type'?'1':'2'} of 2">${step(1,'Loan type',blankChooserStep!=='type',blankChooserStep==='type')}<span class="blank-step-line" aria-hidden="true"></span>${step(2,'Sub-type',false,blankChooserStep==='subtype')}</div>`;
  }

  /* ============================================================
     CLIENT ACCOUNT STATEMENTS
     Statements are snapshots of locally recorded deposits and withdrawals.
     Their calendar periods and running balances use recorded Ghana timestamps,
     not the ledger's separate posting order. All arithmetic is exact pesewas.
     ============================================================ */
  let statementCustomerId = '';
  const statementPartsFormat = new Intl.DateTimeFormat('en-GB', {timeZone:'Africa/Accra',year:'numeric',month:'2-digit',day:'2-digit'});
  const statementDateFormat = new Intl.DateTimeFormat('en-GB', {timeZone:'Africa/Accra',day:'2-digit',month:'2-digit',year:'numeric'});
  const statementTimeFormat = new Intl.DateTimeFormat('en-GB', {timeZone:'Africa/Accra',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'short'});
  const statementPeriodLabels = {daily:'Daily',weekly:'Weekly',monthly:'Monthly',yearly:'Yearly',range:'Custom range'};
  const statementDay = time => {
    const parts=Object.fromEntries(statementPartsFormat.formatToParts(new Date(time)).map(item=>[item.type,item.value]));
    return `${parts.year.padStart(4,'0')}-${parts.month}-${parts.day}`;
  };
  function statementMoney(value) { return money(value); }
  function statementRange(period,reference,from,to) {
    const validStatementDay=day=>validDay(day)&&day>='1900-01-01'&&day<='9998-12-31';
    if(!Object.prototype.hasOwnProperty.call(statementPeriodLabels,period))throw new Error('Choose a statement period.');
    if(period==='range'){
      if(!validStatementDay(from)||!validStatementDay(to))throw new Error('Enter valid From and To dates between 1900 and 9998.');
      if(from>to)throw new Error('The From date must be on or before the To date.');
      return {period,start:from,end:to};
    }
    if(!validStatementDay(reference))throw new Error('Enter a valid reference date between 1900 and 9998.');
    let start=reference,end=reference;
    if(period==='weekly'){
      const dayOfWeek=new Date(`${reference}T00:00:00Z`).getUTCDay();
      start=addDays(reference,-((dayOfWeek+6)%7));end=addDays(start,6);
    }else if(period==='monthly'){
      start=`${reference.slice(0,7)}-01`;
      const [year,month]=reference.split('-').map(Number);
      const last=new Date(Date.UTC(year,month,0)).getUTCDate();
      end=`${reference.slice(0,7)}-${String(last).padStart(2,'0')}`;
    }else if(period==='yearly'){
      start=`${reference.slice(0,4)}-01-01`;end=`${reference.slice(0,4)}-12-31`;
    }
    return {period,start,end};
  }
  function statementSelection() {
    return statementRange($('#statement-period')?.value,isoFromDisplayDate($('#statement-reference')?.value),isoFromDisplayDate($('#statement-from')?.value),isoFromDisplayDate($('#statement-to')?.value));
  }
  function statementModel(source,customerId,range) {
    let opening=0n,totalDeposits=0n,totalWithdrawals=0n,previousMs=null,outOfOrder=false;
    const entries=[];
    source.transactions.forEach((tx,index)=>{
      if(tx.customerId!==customerId)return;
      const ms=Date.parse(tx.createdAt),day=statementDay(ms);
      if(previousMs!==null&&ms<previousMs)outOfOrder=true;
      previousMs=ms;
      const signed=tx.type==='deposit'?BigInt(tx.amountPesewas):-BigInt(tx.amountPesewas);
      // ISO dates in this UI have four-digit years. An imported timestamp beyond
      // year 9999 is necessarily later than any selectable statement period.
      if(day.length>10)return;
      if(day<range.start)opening+=signed;
      else if(day<=range.end)entries.push({tx,index,ms,signed});
    });
    entries.sort((a,b)=>a.ms-b.ms||a.index-b.index);
    let running=opening,negativeBalance=running<0n;
    for(const entry of entries){
      running+=entry.signed;entry.balance=running;
      if(entry.tx.type==='deposit')totalDeposits+=BigInt(entry.tx.amountPesewas);
      else totalWithdrawals+=BigInt(entry.tx.amountPesewas);
      if(running<0n)negativeBalance=true;
    }
    return {opening,totalDeposits,totalWithdrawals,closing:running,entries,outOfOrder,negativeBalance};
  }

      <footer class="st-footer">SANKOFA · LOCAL DEMO STATEMENT · NOT BANK-ISSUED &nbsp; | &nbsp; PLEASE PROTECT THIS PRIVATE ACCOUNT INFORMATION</footer></div>
    </article>`;

  /* The statement a lender actually needs: loans taken, repayments made and
     the balance still owed, reconstructed from recorded dates. */
  function loanStatementModel(source,customerId,range){
    const events=[];
    for(const loan of source.loans){
      if(loan.customerId!==customerId||loan.status!=='active')continue;
      if(loan.approvedAt){
        events.push({kind:'issued',ms:Date.parse(loan.approvedAt),loan,ref:labelForLoan(loan),amount:BigInt(loan.principalPesewas)});
        if(loan.interestPesewas>0)events.push({kind:'interest',ms:Date.parse(loan.approvedAt)+1,loan,ref:labelForLoan(loan),amount:BigInt(loan.interestPesewas)});
      }
      for(const item of loan.schedule||[])if(item.paidAt)events.push({kind:'repaid',ms:Date.parse(item.paidAt),loan,item,ref:labelForLoan(loan),amount:BigInt(item.amountPesewas)});
    }
    const direction=event=>event.kind==='repaid'?-1n:1n;
    events.sort((a,b)=>a.ms-b.ms);
    let opening=0n,taken=0n,interest=0n,repaid=0n,outOfOrder=false,previous=null;
    const entries=[];
    for(const event of events){
      const day=statementDay(event.ms);
      if(day.length>10)continue;
      if(previous!==null&&event.ms<previous)outOfOrder=true;
      previous=event.ms;
      if(day<range.start)opening+=direction(event)*event.amount;
      else if(day<=range.end)entries.push(event);
    }
    let running=opening;
    for(const entry of entries){
      running+=direction(entry)*entry.amount;
      entry.balance=running;
      if(entry.kind==='issued')taken+=entry.amount;
      else if(entry.kind==='interest')interest+=entry.amount;
      else repaid+=entry.amount;
    }
    const active=source.loans.filter(loan=>loan.customerId===customerId&&loan.status==='active');
    const owed=loanBookTotals(active).outstanding;
    return {opening,taken,interest,repaid,closing:running,owed,entries,outOfOrder};
  }

      :'Balances are reconstructed from recorded timestamps in Ghana time. Incorrect device dates or times can affect historical balances.';
    const count=model.entries.length;
    return `<article class="statement-paper" aria-label="Loan statement">
      <header class="st-header"><div class="st-brand">${brandMark}<div><strong>sankofa</strong><small>SAVINGS &amp; LOANS · GHANA</small></div></div><div class="st-title"><span>LOAN STATEMENT</span><h1>${esc(statementPeriodLabels[range.period])} statement</h1><small>${customer.isSample?'FICTIONAL SAMPLE CLIENT':'LOCAL DEMO CLIENT'}</small></div></header>
      <div class="st-meta"><div><span>Client</span><strong>${esc(fullName(customer))}</strong></div><div><span>Demo client number</span><strong>${esc(customer.accountNumber)}</strong></div><div><span>Statement period · inclusive</span><strong>${esc(dateSpan)}</strong></div><div><span>Generated · Ghana time</span><strong>${esc(statementDateFormat.format(new Date(generated)))} at ${esc(statementTimeFormat.format(new Date(generated)))}</strong></div></div>

      <table class="statement-table" aria-label="Statement entries"><colgroup><col class="st-col-date"><col class="st-col-ref"><col class="st-col-type"><col class="st-col-balance"><col class="st-col-balance"></colgroup><thead><tr class="st-repeat-context"><th colspan="5"><span>${esc(fullName(customer))} · ${esc(customer.accountNumber)}</span><span>${esc(dateSpan)}</span></th></tr><tr><th scope="col">Date &amp; time</th><th scope="col">Loan</th><th scope="col">Activity</th><th scope="col" class="st-num">Amount</th><th scope="col" class="st-num">Balance owed</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="st-end"><div class="st-note"><strong>About this statement · ${esc(fullName(customer))} · ${esc(customer.accountNumber)} · ${esc(dateSpan)}</strong><p>${esc(chronologyNote)}</p><p>Balance owed today, across all active loans: ${esc(money(model.owed))}. This statement covers loans taken and repayments recorded in this workspace only; periods that extend into the future are incomplete.</p></div>
      <footer class="st-footer">SANKOFA · LOCAL DEMO STATEMENT · NOT LENDER-ISSUED &nbsp; | &nbsp; PLEASE PROTECT THIS PRIVATE CLIENT INFORMATION</footer></div>
    </article>`;

  /* ============================================================
     ACTIVITY PIE CHARTS AND PRINTABLE AUDIT REPORTS
     Audit reports are summaries of the local audit log, not proof of a
     real-world cash transfer or an authenticated, tamper-proof audit trail.

  /* Monthly movement buckets for the bar graph that accompanies the pie. */
  function activityMonths(rows,count=6) {
    const today=todayGhana(),[ty,tm]=today.split('-').map(Number),buckets=[];
    for(let back=count-1;back>=0;back--){
      let year=ty,month=tm-back;
      while(month<1){month+=12;year-=1;}
      buckets.push({key:`${year}-${String(month).padStart(2,'0')}`,deposits:0n,withdrawals:0n,count:0});
    }
    const index=new Map(buckets.map(bucket=>[bucket.key,bucket]));
    for(const tx of rows){
      const ms=Date.parse(tx.createdAt);if(!Number.isFinite(ms))continue;
      const bucket=index.get(dateInGhana(new Date(ms)).slice(0,7));if(!bucket)continue;
      if(tx.type==='deposit')bucket.deposits+=BigInt(tx.amountPesewas);
      else if(tx.type==='withdrawal')bucket.withdrawals+=BigInt(tx.amountPesewas);
      else continue;
      bucket.count++;

    return buckets;

  const MONTH_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* The bar graph gives the pie its time dimension: six months, two bars each. */
  function activityBars(rows) {
    const buckets=activityMonths(rows);
    let peak=0n;
    for(const bucket of buckets)for(const value of [bucket.deposits,bucket.withdrawals])if(value>peak)peak=value;
    const scale=peak>0n?Number(peak):1;
    const height=value=>value>0n?`${Math.max(3,Math.round(Number(value)/scale*100))}%`:'0%';
    const summary=buckets.map(bucket=>`${MONTH_SHORT[Number(bucket.key.slice(5,7))-1]} ${bucket.key.slice(0,4)}: deposits ${money(bucket.deposits)}, withdrawals ${money(bucket.withdrawals)}`).join('; ');
    const bars=buckets.map(bucket=>{
      const month=Number(bucket.key.slice(5,7))-1,year=bucket.key.slice(0,4);
      const net=bucket.deposits-bucket.withdrawals;
      return `<div class="bar-month${bucket.count===0?' is-empty':''}">
        <div class="bar-pair">
          <span class="bar bar-deposit" style="--bar-height:${height(bucket.deposits)}" title="Deposits ${esc(money(bucket.deposits))}"></span>
          <span class="bar bar-withdrawal" style="--bar-height:${height(bucket.withdrawals)}" title="Withdrawals ${esc(money(bucket.withdrawals))}"></span>
          <span class="bar-tip">${bucket.deposits>0n||bucket.withdrawals>0n?`<strong>${esc(MONTH_SHORT[month])} ${esc(year)}</strong><span>In ${esc(money(bucket.deposits))}</span><span>Out ${esc(money(bucket.withdrawals))}</span><span class="bar-tip-net">Net ${esc(money(net))}</span>`:'<strong>No activity</strong>'}</span>
        </div>
        <span class="bar-label">${esc(MONTH_SHORT[month])}<small>${esc(year.slice(2))}</small></span>
      </div>`;
    }).join('');
    const total=buckets.reduce((sum,bucket)=>sum+bucket.count,0);
    return `<div class="activity-bars"><div class="bars-head"><div><h3>Movement by month</h3><p>Deposits against withdrawals · last six months</p></div><span class="bars-scale">${total?`Peak ${esc(money(peak))}`:'No movement yet'}</span></div><div class="bars-plot" role="img" aria-label="Monthly deposits and withdrawals: ${esc(summary)}"><div class="bars-grid" aria-hidden="true"><span></span><span></span><span></span></div><div class="bars">${bars}</div></div><div class="bars-legend"><span><i class="bars-key bars-key-deposit"></i>Deposits</span><span><i class="bars-key bars-key-withdrawal"></i>Withdrawals</span><span class="bars-note">Tap or hover a bar for that month's figures.</span></div></div>`;
  }
  function activityPie(rows,caption='Deposit & withdrawal mix',interactive=false) {
    let deposits=0n,withdrawals=0n;
    for(const tx of rows){if(tx.type==='deposit')deposits+=BigInt(tx.amountPesewas);else if(tx.type==='withdrawal')withdrawals+=BigInt(tx.amountPesewas);}
    const total=deposits+withdrawals,green='#2c885e',coral='#d27450';
    const ratio=total?Number(deposits)/Number(total):0;
    const percent=value=>{
      if(!total)return '—';

    };
    /* Each slice carries its own figures so the centre and the labels can show

    const detail=(type,value)=>`data-pie-type="${type}" data-pie-label="${type==='deposit'?'Deposits':'Withdrawals'}" data-pie-share="${esc(percent(value))}" data-pie-amount="${esc(money(value))}"`;
    const nudge=(mid)=>`--nx:${(Math.cos(mid)*5).toFixed(2)}px;--ny:${(Math.sin(mid)*5).toFixed(2)}px`;
    const hit=(type,value,style='')=>interactive?`class="pie-slice pie-${type}" ${style} role="button" tabindex="0" data-action="pie-drill" data-type="${type}" ${detail(type,value)} aria-label="View ${type==='deposit'?'deposit':'withdrawal'} transactions: ${esc(money(value))}, ${esc(percent(value))} of gross flow"`:`class="pie-slice pie-${type}" ${style} ${detail(type,value)}`;
    const wedge=(start,end,fill,type,value)=>{

      return `<path ${hit(type,value,`style="${nudge(mid)}"`)} d="M 100 100 L ${x1.toFixed(4)} ${y1.toFixed(4)} A 85 85 0 ${end-start>Math.PI?1:0} 1 ${x2.toFixed(4)} ${y2.toFixed(4)} Z" fill="${fill}" stroke="#fff" stroke-width="2.5"/>`;
    };

    const sliceLabel=(start,end,type,value)=>{

      if(!total||value===0n)return '';

    };
    let slices,labels='';
    if(!total){
      slices='<circle cx="100" cy="100" r="85" fill="#e8f2e6" stroke="#d5e7d2" stroke-width="2"/><circle cx="100" cy="100" r="70" fill="none" stroke="#c4ddc3" stroke-width="1.5" stroke-dasharray="4 5"/>';
    }else if(withdrawals===0n){
      slices=`<circle ${hit('deposit',deposits,`style="${nudge(-Math.PI/2)}"`)} cx="100" cy="100" r="85" fill="url(#pie-deposit-gradient)"/>`;
      labels=sliceLabel(-Math.PI/2,Math.PI*1.5,'deposit',deposits);
    }else if(deposits===0n){
      slices=`<circle ${hit('withdrawal',withdrawals,`style="${nudge(-Math.PI/2)}"`)} cx="100" cy="100" r="85" fill="url(#pie-withdrawal-gradient)"/>`;
      labels=sliceLabel(-Math.PI/2,Math.PI*1.5,'withdrawal',withdrawals);
    }else{
      const start=-Math.PI/2,split=start+ratio*Math.PI*2;
      slices=wedge(start,split,'url(#pie-deposit-gradient)','deposit',deposits)+wedge(split,start+Math.PI*2,'url(#pie-withdrawal-gradient)','withdrawal',withdrawals);
      labels=sliceLabel(start,split,'deposit',deposits)+sliceLabel(split,start+Math.PI*2,'withdrawal',withdrawals);
    }
    const legend=(label,value,color,type)=>{
      const contents=`<span class="pie-key" style="background:${color}"></span><span class="pie-legend-copy"><span>${esc(label)}</span><strong>${moneyHTML(value)}</strong></span><span class="pie-share">${esc(percent(value))}</span>${interactive?'<span class="pie-arrow" aria-hidden="true">↗</span>':''}`;
      return interactive?`<button type="button" class="pie-legend-item pie-legend-button" data-action="pie-drill" data-type="${type}" ${detail(type,value)} aria-label="View ${esc(type==='deposit'?'deposit':'withdrawal')} transactions: ${esc(money(value))}, ${esc(percent(value))} of gross flow">${contents}</button>`:`<div class="pie-legend-item">${contents}</div>`;
    };
    const chartAria=`${caption}: deposits ${money(deposits)}, withdrawals ${money(withdrawals)}. ${interactive?'Select a slice or its legend to view matching ledger entries.':'Gross activity, not balance.'}`;
    const centreDefault=`<strong>${total?'GROSS<br>FLOW':'NO<br>ACTIVITY'}</strong><small>${total?esc(money(total)):'yet'}</small>`;
    return `<div class="pie-chart-shell${interactive?' pie-chart-interactive':''}"><div class="chart-title-row"><div><h2>${esc(caption)}</h2><p>Gross recorded account movements by value · all time</p></div><span class="pie-chip">${interactive?'EXPLORE ACTIVITY':'ACTIVITY MIX'}</span></div><div class="pie-layout"><div class="pie-visual"><svg class="activity-pie" viewBox="0 0 200 200" role="${interactive?'group':'img'}" aria-label="${esc(chartAria)}"><defs><linearGradient id="pie-deposit-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#73ba76"/><stop offset="1" stop-color="#176645"/></linearGradient><linearGradient id="pie-withdrawal-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a75c"/><stop offset="1" stop-color="#c55e4b"/></linearGradient></defs>${slices}<circle cx="100" cy="100" r="52" fill="#fff" stroke="#eff5ed" stroke-width="1.5" pointer-events="none"/>${labels}</svg><div class="pie-centre" data-pie-centre aria-hidden="true">${centreDefault}</div></div><div class="pie-legend">${legend('Deposits',deposits,green,'deposit')}${legend('Withdrawals',withdrawals,coral,'withdrawal')}<p>${interactive?'Select a slice or row to view its ledger. ':''}Gross flow is not the available balance. Loan approvals and installment flags do not move funds.</p></div></div>${activityBars(rows)}</div>`;
  }
  const auditReportSections = [
    {key:'deposits',kind:'deposit',label:'Deposits',totalLabel:'Total deposits',accent:'#237554',description:'Successful deposit entries recorded in the local audit log.'},
    {key:'withdrawals',kind:'withdrawal',label:'Withdrawals',totalLabel:'Total withdrawals',accent:'#b45f4e',description:'Successful withdrawal entries recorded in the local audit log.'},
    {key:'loans-approved',kind:'loan_approved',label:'Loans taken / approved',totalLabel:'Approved principal',accent:'#5471a0',description:'Loan approvals shown by principal amount. Approval does not credit an account or move funds.'},
    {key:'loans-paid',kind:'installment_paid',label:'Loan installments marked paid',totalLabel:'Marked-paid amount',accent:'#9b7832',description:'Installments manually marked paid. These are tracking flags only; they do not debit an account or confirm a payment.'},

  function auditReportModel(source,range,sectionKeys) {
    const chosen=new Set(sectionKeys),sections=auditReportSections.filter(section=>chosen.has(section.key)).map(section=>({...section,entries:[],total:0n,missingAmounts:0}));

    const representedKinds=new Set(auditReportSections.filter(s=>s.kind).map(s=>s.kind));

    source.auditEvents.forEach((event,index)=>{
      const ms=Date.parse(event.createdAt),day=statementDay(ms);

      const section=byKind.get(event.kind)||(!representedKinds.has(event.kind)?other:null);
      if(!section)return;

  function auditReportSelection() {

  function showAuditReport() {

  function pieShellOf(node){return node?.closest?.('.pie-chart-shell')||null;}
  function pieDefaultCentre(shell){
    if(!shell)return;

    if(!centre||centre.dataset.pieDefault===undefined)return;

  }
  function pieShowDetail(node,{haptic=false}={}){

    if(!centre||!node.dataset.pieLabel)return false;

    centre.classList.add('is-detail');
    centre.dataset.pieTone=node.dataset.pieType||'deposit';
    shell.classList.add('is-detail-active');
    centre.innerHTML=`<strong>${esc(node.dataset.pieLabel)}</strong><small>${esc(node.dataset.pieShare)}</small><em>${esc(node.dataset.pieAmount)}</em>`;
    if(haptic&&typeof navigator.vibrate==='function'){try{navigator.vibrate(9);}catch(error){/* ignored */}}
    return true;
  }
  function pieRelease(shell){
