  <!-- Tailwind is included as requested; essential styles are inline so the app works even without the CDN. -->
  <script src="https://cdn.tailwindcss.com" defer></script>
  <style>
    :root{--forest:#10382d;--forest-dark:#0b2b24;--forest-deep:#09251f;--green:#1c5e45;--mint:#d7f18b;--lime:#d5f184;--ink:#1c2c25;--muted:#748078;--line:#e6ebe5;--canvas:#f5f7f3;--white:#fff;--red:#ad413a;--red-bg:#fff1ee;--shadow:0 8px 24px rgba(29,52,38,.035);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas);font-synthesis:none}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--canvas)}
    body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.62}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #96c86b;outline-offset:2px}
    a{color:inherit;text-decoration:none}
    input,select{color:var(--ink)}
    [hidden]{display:none!important}
    .sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .icon{display:inline-block;width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
    .icon.small{width:15px;height:15px}.icon.tiny{width:13px;height:13px}.icon.large{width:23px;height:23px}
    .app-shell{min-height:100vh;display:flex}
    .sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:244px;background:var(--forest-deep);color:#e8f0e8;display:flex;flex-direction:column;padding:29px 15px 16px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 11px 32px;color:#fff}
    .brand-mark{height:44px;width:44px;flex:none;border-radius:50%;box-shadow:0 0 0 1px rgba(233,238,224,.28),0 6px 16px rgba(8,32,24,.45)}
    /* ---- loan products: three main types, sub-types inside them ---- */
    .loan-product-section{margin-bottom:4px}
    .loan-product-section h2{font-size:15px;margin:0;color:#22362a;letter-spacing:-.2px}
    .loan-product-section .card-title-row p{font-size:11px;color:#96a199;margin:3px 0 0}
    .product-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 16px}
    .product-card{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid #e2e9e1;background:#fff;border-radius:12px;padding:13px 14px;color:#33493b;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
    .product-card:hover{border-color:#bcd2bf;transform:translateY(-1px);box-shadow:0 8px 18px rgba(24,56,40,.07)}
    .product-card.is-active{border-color:#2f6b4d;background:#f2f8ee;box-shadow:inset 0 0 0 1px #2f6b4d}
    .product-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .product-card strong{font-size:13px;line-height:1.15;color:#1d3a29}
    .product-card em{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#eef5e6;color:#4d6f4a;font-size:10px;font-weight:800;font-style:normal}
    .product-card.is-active em{background:#dceccf;color:#2f5a37}
    .product-card small{font-size:10.5px;line-height:1.45;color:#8d998f}
    .product-type-list{display:grid;gap:12px;margin-bottom:6px}
    .product-types{display:grid;gap:7px;transition:opacity .15s}
    .product-types.is-dimmed{opacity:.45}
    .product-row-label{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#809087}
    .product-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px}
    .product-chip{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid #e4eae3;background:#fbfdfa;border-radius:10px;padding:9px 11px;color:#3c5244;transition:border-color .15s,background .15s}
    .product-chip:hover{border-color:#b6cfb9;background:#f5faf1}
    .product-chip[aria-pressed="true"]{border-color:#2f6b4d;background:#eef7e7;box-shadow:inset 0 0 0 1px #2f6b4d}
    .product-chip strong{font-size:11.5px;font-weight:700;line-height:1.2;color:#20402c}
    .product-chip small{font-size:10px;color:#8b9a8f;line-height:1.35}
    .product-chip[aria-pressed="true"] small{color:#5c7a5c}
    .product-hint{font-size:11px;color:#8b9a8f}
    .form-error{margin:0;padding:9px 11px;border-radius:8px;background:#fdf0ee;border:1px solid #f3d9d3;color:#983e36;font-size:11px;font-weight:600}
    .group-register{margin-top:6px;padding:16px;border:1px solid #d9e6d7;border-radius:12px;background:#f8fbf5}
    .loan-register-panel{margin-top:16px}
    .loan-register-panel .group-register{margin-top:0;border:0;padding:0;background:none}
    .loan-register-panel.is-group .group-officer .form-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .loan-register-panel .group-officer{margin-top:16px;padding-top:16px}
    .loan-register-panel .group-officer h4{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:#68836c;font-weight:800;margin:0 0 9px}
    .loan-form-actions{display:flex;justify-content:flex-end;margin-top:16px}
    .loan-form-actions .btn{min-width:320px}
    .group-register h2{font-size:14px;margin:0;color:#22362a}
    .group-register .card-title-row p{font-size:11px;color:#8b9a8f;margin:3px 0 0}
    .group-register h4{margin:14px 0 8px;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#68836c;font-weight:800}
    .group-officer+.group-officer{margin-top:12px;padding-top:12px;border-top:1px solid #e7efe3}
    .group-officer .form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .group-officer .field label{font-size:11px}
    .group-officer .field .control{min-height:36px;font-size:12px}
    .group-members{margin-top:14px;padding-top:14px;border-top:1px solid #e7efe3}
    .group-member-remove{width:32px;height:32px}
    .group-member-list{display:grid;gap:9px;max-height:min(58vh,620px);overflow:auto;padding:2px}
    .group-member-row{display:grid;grid-template-columns:30px minmax(0,1.7fr) minmax(0,1.15fr) minmax(0,1.25fr) 34px;gap:12px;align-items:center;padding:9px 11px;border:1px solid #e6efe2;border-radius:11px;background:#fff}
    .group-member-row:focus-within{border-color:#9ecfa6;background:#fcfffa;box-shadow:0 0 0 3px rgba(60,120,80,.06)}
    .group-member-head{display:grid;grid-template-columns:30px minmax(0,1.7fr) minmax(0,1.15fr) minmax(0,1.25fr) 34px;gap:12px;padding:0 11px 7px;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#8b9a8f}
    .group-member-row .control{min-height:44px;font-size:13.5px;padding:10px 13px;border-radius:9px}
    .group-member-number{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e6efe0;color:#3f6144;font-size:11.5px;font-weight:800}
    .group-member-remove{color:#9aa79b;width:26px;height:26px}
    .group-member-remove:hover{color:#a8433c;background:#fbf0ef}
    .group-member-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px}
    .group-member-actions .helper{margin:0;font-size:10.5px;color:#8b9a8f}
    .group-summary{display:grid;gap:12px}
    .group-officer-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:9px 11px;border:1px solid #e9efe6;border-radius:9px;background:#fbfdf9;font-size:12px}
    .group-officer-line .detail-label{min-width:130px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b9a8f;font-weight:800}
    .group-officer-line strong{color:#1f3a29}
    .group-officer-line .muted{color:#9aa79b;font-size:11px}
    @media(max-width:900px){.product-cards{grid-template-columns:1fr}.group-officer .form-grid{grid-template-columns:1fr}.group-member-row{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 30px;padding:8px 9px}.group-member-row input[data-group-field$="ghanaCard"]{display:none}.group-member-head{display:none}.loan-form-actions .btn{min-width:0;width:100%}}
    /* ============ the loan-product portal (step one of a new loan) ============ */
    .loan-portal-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;border-radius:16px;padding:24px 26px;margin:2px 0 18px;background:linear-gradient(135deg,#153e30 0%,#1e5440 55%,#2c7154 100%);color:#eaf4e8;box-shadow:0 18px 40px rgba(16,54,38,.18)}
    .loan-portal-hero:after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border:1px solid rgba(220,244,193,.18);border-radius:50%}
    .loan-portal-hero .eyebrow{color:#a9cfae;letter-spacing:1.4px}
    .loan-portal-hero h2{font-family:'Times New Roman',Times,serif;font-size:25px;line-height:1.15;margin:7px 0 7px;color:#fff;letter-spacing:-.3px}
    .loan-portal-hero p{margin:0;font-size:12px;line-height:1.55;color:#c6ddc5;max-width:56ch}
    .loan-portal-count{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 18px;border-radius:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:10px;letter-spacing:1.1px;color:#cfe4ce;text-transform:uppercase;z-index:1}
    .loan-portal-count strong{font-size:26px;letter-spacing:-.5px;color:#fff;font-family:'Times New Roman',Times,serif}
    .loan-portal-list{display:grid;gap:14px}
    .loan-type-block{border:1px solid #e3ebe1;border-radius:15px;background:#fff;padding:17px 18px 18px;box-shadow:0 6px 18px rgba(21,47,29,.04)}
    .loan-type-head{display:flex;align-items:center;gap:12px;padding-bottom:13px;margin-bottom:13px;border-bottom:1px dashed #e5ede3}
    .loan-type-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:#eaf5e9;color:#3d7a4f;flex:none}
    .loan-type-icon .icon{width:20px;height:20px}
    .loan-type-copy{min-width:0;flex:1}
    .loan-type-copy h2{font-size:15px;margin:0 0 3px;color:#1f3a29;letter-spacing:-.2px}
    .loan-type-copy p{margin:0;font-size:11px;color:#84988a;line-height:1.45}

    /* ============================================================
       SIKA VISUAL REFRESH · screen only
       EDITORIAL BOTANICAL: Times New Roman stays the voice of the
       product (as requested), paired with sans micro-labels, warm
       paper surfaces, pine-and-lime accents and quiet motion.
       Scoped to @media screen so every printed sheet is untouched.
       ============================================================ */
    @media screen{
      :root{
        --forest:#0f3a2b;--forest-dark:#0a2b20;--forest-deep:#072019;--green:#1c5e45;
        --mint:#cfecc4;--lime:#d8e98a;--lime-deep:#c3d76a;
        --ink:#182a22;--muted:#71806f;--line:#e6e9dd;--canvas:#f6f6f0;--white:#fff;
        --red:#a8453c;--red-bg:#fdf0ec;--clay:#b96a45;
        --paper:#fffdf8;--wash:#f2f5ea;
        --radius-lg:18px;--radius:13px;--radius-sm:9px;
        --shadow:0 1px 2px rgba(16,42,31,.05),0 12px 26px -20px rgba(16,42,31,.28);
        --shadow-lift:0 2px 4px rgba(16,42,31,.06),0 22px 44px -26px rgba(16,42,31,.35);
        --ring:0 0 0 3px rgba(196,216,116,.55);
        --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      }
      /* ---------- canvas & texture ---------- */
      html,body{background:var(--canvas)}
      body{
        background-image:
          radial-gradient(900px 460px at 88% -8%,rgba(216,233,138,.30),transparent 70%),
          radial-gradient(760px 420px at -6% 6%,rgba(185,230,207,.22),transparent 72%),
          radial-gradient(700px 500px at 50% 108%,rgba(216,233,138,.13),transparent 70%);
        background-attachment:fixed;
      }
      .main-content{position:relative}
      .main-content::before{
        content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
        background-image:radial-gradient(rgba(16,58,45,.055) 1px,transparent 1px);
        background-size:22px 22px;mask-image:linear-gradient(#000,transparent 62%);
        -webkit-mask-image:linear-gradient(#000,transparent 62%);
      }
      #view{position:relative}
      ::selection{background:var(--lime);color:var(--forest-deep)}
      *{scrollbar-width:thin;scrollbar-color:rgba(16,58,45,.28) transparent}
      *::-webkit-scrollbar{width:10px;height:10px}
      *::-webkit-scrollbar-thumb{background:rgba(16,58,45,.22);border-radius:99px;border:3px solid transparent;background-clip:content-box}
      *::-webkit-scrollbar-thumb:hover{background:rgba(16,58,45,.36);background-clip:content-box}
      /* ---------- micro-labels are sans; the document stays serif ---------- */
      .eyebrow,.side-label,.data-table th,.badge,.metric-kicker,.detail-label,.kbd,.top-search kbd,.staff-role,.chip small,.helper-kicker{
        font-family:var(--sans)!important;font-synthesis:none;
      }
      /* ---------- sidebar ---------- */
      .sidebar{
        background:
          radial-gradient(520px 340px at 12% 4%,rgba(216,233,138,.14),transparent 68%),
          radial-gradient(420px 420px at 96% 86%,rgba(84,196,146,.18),transparent 70%),
          linear-gradient(178deg,#0c3427 0%,#08281e 52%,#061e17 100%);
        box-shadow:inset -1px 0 0 rgba(255,255,255,.06),18px 0 46px -34px rgba(6,30,23,.7);
        padding-top:30px;
      }
      .sidebar:after{
        content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
        background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;
        mask-image:radial-gradient(120% 80% at 20% 100%,#000,transparent 70%);
        -webkit-mask-image:radial-gradient(120% 80% at 20% 100%,#000,transparent 70%);
      }
      .brand{padding-bottom:36px;position:relative;z-index:1}
      .brand-mark{filter:drop-shadow(0 6px 14px rgba(216,233,138,.35))}
      .brand-name{letter-spacing:-.9px}
      .brand-sub{color:#8fae9d;letter-spacing:2px}
      .side-label{color:#7f9d8d;font-size:9px;font-weight:800;letter-spacing:2px;margin:10px 0 11px}
      .side-nav{gap:3px;position:relative;z-index:1}
      .side-link{
        border-radius:11px;padding:11px 12px;font-size:13.5px;color:#a9c0b3;
        transition:background .18s ease,color .18s ease,transform .18s ease;
      }
      .side-link .icon{opacity:.82;transition:opacity .18s,transform .18s}
      .side-link:hover{background:rgba(216,233,138,.09);color:#f2f7ef}
      .side-link:hover .icon{opacity:1;transform:translateX(1px)}
      .side-link[aria-current="page"]{
        background:linear-gradient(96deg,rgba(216,233,138,.22),rgba(216,233,138,.07));
        color:#fff;box-shadow:inset 0 0 0 1px rgba(216,233,138,.32),0 10px 22px -18px rgba(0,0,0,.8);
      }
      .side-link[aria-current="page"]:before{
        left:-13px;width:3px;height:22px;border-radius:0 4px 4px 0;background:var(--lime);
        box-shadow:0 0 12px rgba(216,233,138,.7);
      }
      .side-link[aria-current="page"] .icon{color:var(--lime);opacity:1}
      .sidebar-bottom{
        border:1px solid rgba(216,233,138,.22);border-radius:13px;
        background:linear-gradient(150deg,rgba(216,233,138,.12),rgba(255,255,255,.02));
        backdrop-filter:blur(6px);position:relative;z-index:1;
      }
      .local-head{color:#eaf3e4;font-size:11.5px}
      .local-sub{color:#93b0a1}
      .dot{background:var(--lime);box-shadow:0 0 0 3px rgba(216,233,138,.18),0 0 14px rgba(216,233,138,.55);animation:dotPulse 3.2s ease-in-out infinite}
      @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.55}}
      /* ---------- top bar ---------- */
      .topbar{
        height:74px;background:rgba(252,252,247,.82);border-bottom:1px solid rgba(16,58,45,.08);
        backdrop-filter:blur(14px) saturate(1.1);
      }
      .crumb{font-size:12.5px;color:#7d8f83}
      .crumb strong{color:var(--forest);font-weight:700}
      .top-search{
        border:1px solid #e3e8da;background:#fff;border-radius:11px;color:#7c8e81;
        box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(16,42,31,.04);transition:.18s ease;
      }
      .top-search:hover{border-color:#cfdcb8;color:#3f5748;box-shadow:0 6px 18px -14px rgba(16,42,31,.5)}
      .top-search kbd{background:#f3f6ea;border:1px solid #e4eada;color:#8a9a8b;border-radius:5px}
      .staff-avatar{
        background:linear-gradient(140deg,var(--forest),#2b6a4f);color:#eaf6d9;
        box-shadow:0 0 0 3px #fff,0 0 0 4px #e4e9da;
      }
      .staff-name{font-weight:700;color:#24382c}
      .staff-role{color:#8c9c8e;letter-spacing:1.4px;font-size:9px;font-weight:700}
      /* ---------- page heading ---------- */
      .page-heading{margin-bottom:26px;gap:22px}
      @media (min-width:901px){.page-heading{align-items:flex-end}}
      @media (max-width:620px){
        .page-heading h1{font-size:26px;letter-spacing:-.4px}
        .page-heading p{font-size:12.5px}
        .vault-amount{font-size:34px}
        .metric-number{font-size:28px}
        .panel,.metric-card,.mini-stat{border-radius:15px}
      }
      .eyebrow{
        color:#5f7d68;font-size:10px;font-weight:800;letter-spacing:2.1px;margin-bottom:9px;
        display:inline-flex;align-items:center;gap:7px;
      }
      .eyebrow:before{content:"";width:16px;height:2px;border-radius:2px;background:var(--lime-deep)}
      .page-heading h1{
        font-size:33px;line-height:1.05;letter-spacing:-.7px;color:var(--forest-deep);
        margin:0 0 8px;font-weight:400;
      }
      .page-heading p{margin:0;color:#6f8175;font-size:13.5px;max-width:70ch;line-height:1.5}
      .heading-actions{gap:9px;display:flex;flex-wrap:wrap}
      .back-link{color:#5d7a67;font-size:12.5px;transition:.18s}
      .back-link:hover{color:var(--forest);transform:translateX(-2px)}
      /* ---------- buttons ---------- */
      .btn{
        border-radius:11px;font-size:12.5px;font-weight:700;letter-spacing:.1px;
        padding:10px 15px;transition:transform .16s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease;
      }
      .btn-primary{
        background:linear-gradient(174deg,#17513c,#0d3427);color:#f7fbe9;
        border:1px solid #0c3125;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 22px -16px rgba(13,52,39,.9);
      }
      .btn-primary:hover{background:linear-gradient(174deg,#1a5b42,#0f3b2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 28px -16px rgba(13,52,39,.85);transform:translateY(-1px)}
      .btn-primary:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.28)}
      .btn-primary .icon{color:var(--lime)}
      .btn-secondary{
        background:linear-gradient(180deg,#fff,#fbfbf4);border:1px solid #e2e7d7;color:#3f5748;
        box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(16,42,31,.04);
      }
      .btn-secondary:hover{border-color:#cad8ae;background:#fff;color:#1f3d2e;transform:translateY(-1px);box-shadow:0 12px 22px -18px rgba(16,42,31,.6)}
      .btn-secondary:active{transform:translateY(1px)}
      .btn-soft{background:#eef3e3;border:1px solid #dde5c8;color:#3a5543}
      .btn-small{padding:8px 12px;font-size:11.5px;border-radius:9px}
      .btn-wide{padding:12px 16px}
      .text-link{color:#3d6a4f;font-weight:700;font-size:12px;transition:.16s}
      .text-link:hover{color:var(--forest)}
      .text-link .icon{transition:transform .16s}
      .text-link:hover .icon{transform:translateX(2px)}
      .icon-button{border-radius:10px;transition:.16s}
      .icon-button:hover{background:#f1f5e8;color:var(--forest)}
      /* ---------- cards & panels ---------- */
      .panel,.metric-card,.mini-stat,.settings-panel,.photo-card,.title-field{
        border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--paper);
        box-shadow:var(--shadow);
      }
      .panel,.metric-card,.mini-stat{transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease}
      .metric-card:hover,.mini-stat:hover{border-color:#dfe4d2}
      .panel-header{padding:20px 22px 16px;gap:14px}
      .panel-title{font-size:15px;letter-spacing:-.15px;color:#1b3227;font-weight:700}
      .panel-subtitle{font-size:11.5px;color:#84958a;margin-top:4px}
      .card-padding{padding:20px 22px}
      .card-title-row{gap:12px}
      .card-title-row h2{font-size:16px;letter-spacing:-.2px;color:#1b3227}
      .spaced-panel{margin-top:18px}
      .divider{border-color:var(--line)}
      /* ---------- dashboard metrics ---------- */
      .metric-grid{gap:16px}
      .metric-card{padding:21px 22px;min-height:172px;position:relative;overflow:hidden}
      .metric-card:not(.vault-card):after{
        content:"";position:absolute;right:-40px;bottom:-56px;width:150px;height:150px;border-radius:50%;
        background:radial-gradient(circle,rgba(216,233,138,.32),transparent 70%);pointer-events:none;
      }
      .vault-card{
        background:
          radial-gradient(360px 220px at 92% 6%,rgba(216,233,138,.30),transparent 66%),
          radial-gradient(300px 260px at 6% 96%,rgba(84,196,146,.22),transparent 70%),
          linear-gradient(158deg,#14503a 0%,#0c3527 58%,#082a1f 100%);
        border-color:#0c3527;color:#fff;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 22px 44px -30px rgba(8,42,31,.9);
      }
      .vault-card:before{
        content:"";position:absolute;right:-90px;top:-120px;width:340px;height:340px;border-radius:50%;
        border:1px solid rgba(216,233,138,.30);box-shadow:0 0 0 34px rgba(216,233,138,.06),0 0 0 76px rgba(216,233,138,.035);
        pointer-events:none;
      }
      .metric-kicker{font-size:9.5px;letter-spacing:1.9px;font-weight:800;text-transform:uppercase;color:#8ba396}
      .vault-card .metric-kicker{color:#c9e3bd}
      .vault-icon{
        width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
        background:rgba(216,233,138,.16);color:var(--lime);box-shadow:inset 0 0 0 1px rgba(216,233,138,.28);
      }
      .vault-amount{font-size:44px;line-height:1.02;letter-spacing:-1.4px;color:#fff;margin-top:12px;font-variant-numeric:tabular-nums}
      .vault-caption{color:#b9d6c6;font-size:12px;margin-top:7px}
      .vault-foot{color:#9dc0ae;font-size:10.5px;letter-spacing:.2px;margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
      .metric-number{font-size:34px;letter-spacing:-1px;color:#16291f;font-variant-numeric:tabular-nums;margin-top:8px}
      .metric-caption{color:#83958a;font-size:11.5px}
      .metric-icon{
        width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
        background:linear-gradient(150deg,#f1f6e3,#e8f1d6);color:#517a4f;box-shadow:inset 0 0 0 1px #e4ecd2;
      }
      .metric-link{
        position:absolute;right:18px;bottom:18px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
        background:#f5f8ea;color:#4c7253;box-shadow:inset 0 0 0 1px #e6eed3;transition:.2s ease;
      }
      .metric-link:hover{background:var(--forest);color:var(--lime);transform:rotate(0) scale(1.06)}
      /* ---------- banners ---------- */
      .subtle-banner{border-radius:12px;padding:12px 15px;font-size:11.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
      .prototype-banner{background:linear-gradient(120deg,#f4f8ea,#eef4e0);border:1px solid #e2e9cf;color:#5a7460}
      .sample-banner{background:linear-gradient(120deg,#fdf8e6,#faf3da);border:1px solid #efe2bd;color:#7c6a3c}
      .queue-banner{background:linear-gradient(120deg,#fdf1eb,#fbe9e0);border:1px solid #f0d9cc;color:#8a5a44}
      .dashboard-note{background:linear-gradient(120deg,#f7f9ef,#f2f6e6);border:1px solid #e6ecd7;color:#677c6c}
      /* ---------- tables ---------- */
      .table-wrap{border-radius:0 0 var(--radius-lg) var(--radius-lg)}
      .data-table thead th{
        background:linear-gradient(180deg,#fbfcf6,#f6f8ee);color:#8fa093;
        font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
        padding:12px 17px;border-top:1px solid #edf0e6;border-bottom:1px solid #e9edde;
      }
      .data-table tbody td{border-bottom:1px solid #f0f2e9;padding:13px 17px;transition:background .16s ease}
      .data-table tbody tr:hover td{background:#fbfcf4}
      .data-table tbody tr:last-child td{border-bottom:0}
      .table-primary{color:#1d3228;font-weight:700}
      .table-secondary{color:#93a096;font-size:10.5px}
      .amount,.data-table td .money,.account-balance,.mini-stat .value{font-variant-numeric:tabular-nums}
      /* ---------- badges, chips, chips-in-forms ---------- */
      .badge{
        border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800;letter-spacing:.7px;
        text-transform:uppercase;gap:5px;
      }
      .badge-green{background:#eef6da;color:#3f6b3a;box-shadow:inset 0 0 0 1px #dfeac4}
      .badge-red{background:#fdeeea;color:#9c453b;box-shadow:inset 0 0 0 1px #f3d8d1}
      .badge-grey{background:#f2f4ec;color:#6f8072;box-shadow:inset 0 0 0 1px #e6ead9}
      .badge-amber{background:#fdf6e2;color:#8a6f31;box-shadow:inset 0 0 0 1px #f0e4c0}
      .choice-chip{border-radius:999px;border:1px solid #dfe6cf;background:#fbfcf5;transition:.18s ease}
      .choice-chip:hover{border-color:#c8d8ac;background:#f7faec}
      .choice-chip:has(input:checked){background:#eef6dc;border-color:#b9d189;color:#255237;box-shadow:inset 0 0 0 1px #d3e4ae}
      .choice-chip input{accent-color:#2c6a49}
      .segmented{background:#f1f4e7;border-radius:12px;padding:4px;box-shadow:inset 0 1px 2px rgba(16,42,31,.05)}
      .segment{border-radius:9px;font-size:12px;font-weight:700;color:#6d8172;transition:.18s}
      .segment[aria-pressed="true"]{background:#fff;color:var(--forest);box-shadow:0 1px 2px rgba(16,42,31,.1),inset 0 0 0 1px #e5ead6}
      /* ---------- inputs ---------- */
      .control{
        border-radius:10px;border:1px solid #e0e5d5;background:#fff;color:#1e332a;
        box-shadow:inset 0 1px 2px rgba(16,42,31,.04);transition:border-color .18s,box-shadow .18s,background .18s;
      }
      .control:hover{border-color:#cfdab8}
      .control:focus,.control:focus-visible{border-color:#9dbb6d;box-shadow:var(--ring);outline:none}
      .control::placeholder{color:#a6b2a4}
      label{color:#3c5445}
      .field>label,.field label{font-size:12px;font-weight:700;letter-spacing:.1px;color:#33503f}
      .helper{color:#8b9a8c;font-size:10.5px}
      .search-field .control{padding-left:37px}
      .search-field>.icon{color:#9fb0a2}
      .filter-select{border-radius:10px}
      /* ---------- empty states ---------- */
      .empty-state{color:#8ea094}
      .empty-icon{
        width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin:0 auto 13px;
        background:linear-gradient(150deg,#f4f8e8,#eaf2d8);color:#7e9a6c;box-shadow:inset 0 0 0 1px #e6edd2;
      }
      .empty-state strong{color:#3c5647;font-size:13px}
      .empty-state p{color:#93a196;font-size:11.5px}
      /* ---------- pies & charts ---------- */
      .chart-panel{padding:22px}
      .pie-legend-row{border-radius:11px;transition:.18s}
      .pie-legend-row:hover{background:#f8faf0}
      /* ---------- hero blocks (client/account) ---------- */
      .client-hero{
        background:linear-gradient(140deg,#ffffff,#f8faef);border:1px solid var(--line);
        border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;
      }
      .client-hero h1{letter-spacing:-.5px;color:var(--forest-deep)}
      .account-hero{
        background:
          radial-gradient(300px 180px at 92% 0%,rgba(216,233,138,.35),transparent 70%),
          linear-gradient(150deg,#f3f8e6,#eaf2d9);
        border:1px solid #e2ead1;border-radius:14px;
      }
      .account-balance{letter-spacing:-.6px;color:#0f3a2b}
      .detail-label{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:#93a196;font-weight:800}
      .detail-value{color:#24382c}
      .avatar,.large-avatar{box-shadow:0 0 0 3px #fff,0 0 0 4px #e6ebd8}
      /* ---------- pagination & misc ---------- */
      .schedule-pagination{border-top:1px solid var(--line);color:#86988a;font-size:11px;padding:13px 20px}
      .mini-stats{gap:14px}
      .mini-stat{padding:16px 18px;border-radius:14px;background:linear-gradient(160deg,#fffdf8,#fbfcf3)}
      .mini-stat .label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#93a196;font-weight:800}
      .mini-stat .value{font-size:23px;letter-spacing:-.5px;color:#1a3128;margin-top:6px}
      /* ---------- modal & toast ---------- */
      .modal-backdrop{background:rgba(7,28,21,.55);backdrop-filter:blur(6px) saturate(1.05)}
      .modal{border-radius:20px;border:1px solid rgba(255,255,255,.6);box-shadow:0 40px 80px -40px rgba(6,30,23,.7)}
      .modal-header{border-bottom:1px solid var(--line);padding:20px 24px}
      .modal-header h2{letter-spacing:-.3px;color:#152b22}
      .modal-footer{border-top:1px solid var(--line);background:#fbfcf6;border-radius:0 0 20px 20px}
      .toast{
        background:linear-gradient(150deg,#12402f,#0a2c21);color:#eef7e3;border:1px solid rgba(216,233,138,.28);
        border-radius:13px;box-shadow:0 24px 44px -26px rgba(6,30,23,.85);
      }
      .toast .icon,.toast svg{color:var(--lime)}
      .toast-error{background:linear-gradient(150deg,#7d3129,#5e241e);border-color:rgba(255,190,170,.35)}
      /* ---------- registration & forms ---------- */
      .registration-layout,.form-layout{gap:20px}
      /* Registration intro card: soft paper wash with a lime edge, never a pill. */
      .registration-progress{
        border-radius:var(--radius-lg);border:1px solid #e4ead5;
        background:
          radial-gradient(420px 200px at 94% 8%,rgba(216,233,138,.40),transparent 70%),
          linear-gradient(140deg,#fffdf8,#f7faee);
        box-shadow:var(--shadow);position:relative;overflow:hidden;
      }
      .registration-progress:after{
        content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
        background:linear-gradient(180deg,var(--lime-deep),rgba(195,215,106,0));
      }
      .registration-progress-top h2{letter-spacing:-.3px;color:#12372a}
      .registration-step-number{transition:.2s ease}
      .registration-steps li[aria-current="step"] .registration-step-number{
        background:linear-gradient(160deg,#1a5540,#0e3527);border-color:#0e3527;
        box-shadow:0 6px 14px -8px rgba(14,53,39,.9),0 0 0 4px rgba(216,233,138,.35);
      }
      .registration-steps li.is-complete .registration-step-number{background:#eef7dd;border-color:#d8e8b8;color:#3d7042}
      .registration-steps li.is-complete .registration-step-name{color:#5d7d62}
      .registration-footer{
        border-top:1px solid var(--line);background:rgba(252,253,247,.9);backdrop-filter:blur(10px);
        border-radius:0 0 var(--radius-lg) var(--radius-lg);
      }
      .title-field{background:linear-gradient(160deg,#fbfcf5,#f7faf0)}
      .title-field>summary:hover{background:#f2f7e6}
      .title-field>summary strong{background:#e9f3d9;color:#2d5c3f;box-shadow:inset 0 0 0 1px #dfeac6}
      .photo-card{background:linear-gradient(160deg,#fbfcf5,#f6f9ee)}
      .choice-field{border:0;background:none;box-shadow:none}
      /* ---------- phones: the nav becomes a compact, scrollable rail ---------- */
      @media (max-width:620px){
        .sidebar{
          padding:14px 14px 12px;overflow:visible;
          background:
            radial-gradient(320px 160px at 10% 0%,rgba(216,233,138,.20),transparent 70%),
            linear-gradient(178deg,#0c3427,#08281e 70%,#061e17);
        }
        .sidebar:after{display:none}
        .brand{padding:0 2px 12px;gap:9px}
        .brand-mark{width:32px;height:32px;filter:none;box-shadow:0 0 0 1px rgba(233,238,224,.25)}
        .brand-name{font-size:21px}
        .brand-sub{font-size:7px;letter-spacing:1.4px}
        .side-label{display:none}
        .side-group{margin-top:0}
        /* Nine entries, three even rows of three: no sideways swiping. */
        .side-nav,.side-group .side-nav{
          display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
          gap:7px;overflow:visible;padding:0;margin:0;
          -webkit-mask-image:none;mask-image:none;
        }
        .side-group{margin-top:7px;padding-top:0;border-top:0}
        .side-link{
          width:100%;min-width:0;height:100%;min-height:62px;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;gap:5px;
          padding:9px 5px;border-radius:13px;font-size:10.5px;font-weight:700;line-height:1.15;
          background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.085);
        }
        .side-link .icon{width:16px;height:16px;opacity:.92}
        .side-link span{display:block;white-space:normal;overflow-wrap:anywhere;max-width:100%}
        .side-link:hover{transform:none}
        .side-link[aria-current="page"]{
          background:linear-gradient(160deg,rgba(216,233,138,.32),rgba(216,233,138,.10));
          box-shadow:inset 0 0 0 1px rgba(216,233,138,.55),0 8px 18px -14px rgba(0,0,0,.8);
        }
        .side-link[aria-current="page"]:before{display:none}
        .sidebar-bottom{display:none}
        /* Keep the metric cards uncluttered: the whole card is the link. */
        .metric-link{display:none}
        .metric-card .metric-caption{padding-right:0}
        .metric-card{min-height:132px}
      }
      /* ---------- activity chart: labels, tactile slices, monthly bars ---------- */
      .pie-visual{position:relative;padding:4px}
      .activity-pie{overflow:visible;width:min(100%,300px)!important;max-width:300px!important}
      @media (min-width:901px){.pie-layout{grid-template-columns:minmax(260px,320px) minmax(0,1fr)!important;gap:34px!important}}
      @media (max-width:620px){.activity-pie{width:min(100%,250px)!important;max-width:250px!important}}
      .pie-slice{
        cursor:pointer;transform-box:view-box;
        transition:transform .34s cubic-bezier(.34,1.5,.5,1),filter .28s ease,opacity .28s ease;
      }
      .activity-pie[role="img"] .pie-slice{cursor:default}
      .pie-slice.is-active,.pie-slice:hover,.pie-slice:focus-visible,.pie-slice.is-pressed{
        transform:translate(var(--nx,0),var(--ny,0)) scale(1.028);
        filter:brightness(1.06) drop-shadow(0 10px 16px rgba(16,58,45,.30));
      }
      .pie-slice.is-pressed{transform:translate(var(--nx,0),var(--ny,0)) scale(1.045);filter:brightness(1.1) drop-shadow(0 14px 22px rgba(16,58,45,.36))}
      .pie-slice:focus-visible{outline:none}
      .pie-slice-label{

      .metric-number.is-alert{color:#b8543a}
      .past-due-card{border-color:#f3d8cf;background:#fffaf8}
      .overdue-banner{background:#fff3ee;color:#9c4a33;border:1px solid #f4d9ce}
      .loan-desk-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:15px;margin-top:15px}

      @media(max-width:620px){.loan-desk-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.loan-desk-metrics .loan-book-card{grid-column:1/-1}.loan-desk-metrics .past-due-card{grid-column:1/-1}.loan-desk-metrics .metric-card{padding:14px}.loan-book-card{min-height:0}.loan-book-card .vault-amount{font-size:25px}.metric-number.small-amount{font-size:20px}.loan-desk-metrics .metric-caption{font-size:11.5px;line-height:1.35}.workspace-facts{grid-template-columns:1fr}}
      .repay-list{list-style:none;margin:0;padding:0}

      .repay-list li:first-child{border-top:0}
      .repay-person{display:flex;align-items:center;gap:10px;min-width:0}
      .repay-figure{text-align:right;font-family:var(--serif)}
      .repay-figure strong{display:block;font-size:13.5px;color:#17694a}
      .repay-figure small{font-family:var(--sans);font-size:9.5px;letter-spacing:.4px;color:#8b9c8d;text-transform:uppercase}
      .repay-empty{padding:20px 21px;text-align:center;color:#7d9080}
      .repay-empty svg{width:22px;height:22px;margin-bottom:8px;color:#a8bda9}
      .repay-empty p{margin:0 0 12px;font-size:12.5px}
      .pie-centre{transition:transform .3s ease,opacity .25s ease}
      /* Detail mode: the donut hole becomes a small white card that pops in,
         with the slice name, its share and its amount in three clean steps. */
      @keyframes centrePop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
      .pie-chart-shell .pie-slice-label{transition:opacity .22s ease,filter .22s ease}
      .pie-chart-shell.is-detail-active .pie-slice-label{opacity:0}
      .pie-centre.is-detail{
        width:34.5%;height:34.5%;margin:auto;border-radius:50%;gap:0;
        background:radial-gradient(circle at 50% 30%,#fff 55%,#f6faf0 100%);
        box-shadow:0 10px 24px -14px rgba(16,58,45,.55),inset 0 0 0 1px rgba(16,58,45,.07);
        animation:centrePop .3s cubic-bezier(.3,1.4,.5,1) both;
      }

        text-transform:uppercase;color:#7b8f80;line-height:1;
      }
      .pie-centre.is-detail small{
        font-family:var(--sans)!important;font-size:23px;font-weight:800;letter-spacing:-.6px;
        line-height:1.05;margin-top:5px;color:#17694a;font-variant-numeric:tabular-nums;
      }
      .pie-centre.is-detail em{
        display:block;font-style:normal;font-family:var(--sans)!important;
        font-size:9.5px;font-weight:700;color:#87998b;margin-top:3px;letter-spacing:.1px;
      }
      .pie-centre.is-detail:after{
        content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
        width:34%;height:3px;border-radius:3px;background:linear-gradient(90deg,#3f9a68,#17694a);
      }
      .pie-centre.is-detail[data-pie-tone="withdrawal"] small{color:#b2562e}
      .pie-centre.is-detail[data-pie-tone="withdrawal"]:after{background:linear-gradient(90deg,#eaa27a,#bc5c46)}
      .pie-legend-item{transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
      .pie-legend-item.is-active{background:#f6faee;box-shadow:inset 0 0 0 1px #dfe9c9;transform:translateY(-1px)}
      /* monthly bars */
      .activity-bars{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
      .bars-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
      .bars-head h3{margin:0;font-size:14px;letter-spacing:-.15px;color:#1b3227}
      .bars-head p{margin:3px 0 0;font-size:11px;color:#86998b}
      .bars-scale{
        flex:none;font-family:var(--sans)!important;font-size:9px;font-weight:800;letter-spacing:1.1px;
        text-transform:uppercase;color:#5f7d68;background:#f3f7e8;border:1px solid #e6edd4;
        border-radius:999px;padding:5px 9px;
      }
      .bars-plot{position:relative;padding:10px 0 0}
      .bars-grid{position:absolute;left:0;right:0;top:10px;height:118px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
      .bars-grid span{display:block;height:1px;background:linear-gradient(90deg,rgba(16,58,45,.10),rgba(16,58,45,.045))}
      .bars{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;align-items:end}
      .bar-month{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
      .bar-pair{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:118px;width:100%;padding:0 3px;border-bottom:1px solid rgba(16,58,45,.20)}
      .bar{
        display:block;width:min(16px,42%);height:var(--bar-height,0%);border-radius:7px 7px 3px 3px;
        transition:height .5s cubic-bezier(.22,.68,.32,1),filter .18s ease,transform .18s ease;
        transform-origin:bottom center;
      }
      .bar-deposit{background:linear-gradient(180deg,#5fb579,#17694a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .bar-withdrawal{background:linear-gradient(180deg,#eaa27a,#bc5c46);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .bar-issued,.bar-repaid{background:linear-gradient(180deg,#5fb579,#17694a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .bar-paid{background:linear-gradient(180deg,#f0cf7a,#b0801f);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .bar-pair:hover .bar{filter:saturate(1.12)}
      .bar-month:hover .bar-withdrawal{transform:scaleY(1.03)}
      .bar-label{position:relative;z-index:1}
      .bar-tip{
        position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);
        display:grid;gap:1px;padding:8px 10px;border-radius:10px;width:max-content;max-width:170px;
        background:linear-gradient(160deg,#123c2c,#0a2b20);color:#eaf6df;
        font-family:var(--sans)!important;font-size:10px;line-height:1.35;
        box-shadow:0 18px 30px -22px rgba(6,30,23,.9);border:1px solid rgba(216,233,138,.25);
        opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:3;
      }
      .bar-tip strong{font-size:10.5px;letter-spacing:.3px;color:#fff}
      .bar-tip span{color:#bcd8c6}
      .bar-tip-net{color:var(--lime)!important;font-weight:700}
      .bar-month:hover .bar-tip,.bar-pair:focus-within .bar-tip{opacity:1;transform:translate(-50%,0)}
      .bar-label{
        display:flex;align-items:baseline;gap:2px;font-family:var(--sans)!important;
        font-size:10px;font-weight:800;letter-spacing:.4px;color:#5d7a68;text-transform:uppercase;
      }
      .bar-label small{font-size:8.5px;color:#9dae9f;font-weight:700}
      .bar-month.is-empty .bar-pair:after{
        content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
        width:14px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,#cfdccb 0 3px,transparent 3px 6px);
      }
      .bar-month.is-empty .bar-label{color:#a6b5a6}
      .bars-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:10.5px;color:#75897b}
      .bars-legend>span{display:inline-flex;align-items:center;gap:6px}
      .bars-key{display:inline-block;width:9px;height:9px;border-radius:3px}
      .bars-key-deposit,.bars-key-issued,.bars-key-repaid{background:linear-gradient(160deg,#5fb579,#17694a)}
      .bars-key-withdrawal{background:linear-gradient(160deg,#eaa27a,#bc5c46)}
      .bars-key-paid{background:linear-gradient(160deg,#f0cf7a,#b0801f)}
      .bars-note{color:#93a496;font-size:10px}
      @media (max-width:620px){
        .activity-bars{margin-top:14px;padding-top:14px}
        .bars{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 0}
        .bar-pair{height:92px;padding:0 2px}
        .bars-grid{height:92px}
        .bar-label{font-size:9.5px}
        .bars-note{display:none}
        .pie-slice-label{font-size:13px}
      }
      /* ---------- deposit vs withdrawal: a colour identity per mode ---------- */
      .transaction-grid .segmented{background:linear-gradient(100deg,#eef4df,#e8f0d8);transition:background .3s ease}
      .transaction-grid .segment{
        position:relative;font-weight:700;letter-spacing:.2px;color:#61795f;
        border:1px solid transparent;transition:background .3s ease,color .3s ease,box-shadow .3s ease,transform .16s ease,border-color .3s ease;
      }
      .transaction-grid[data-tx-mode="withdrawal"] .segmented{background:linear-gradient(100deg,#fbeadf,#f7e1d3)}
      .transaction-grid .segment:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.55)}
      /* Deposit = pine + lime */
      .transaction-grid[data-tx-mode="deposit"] .segment[data-mode="deposit"][aria-pressed="true"]{
        background:linear-gradient(158deg,#1b5c43,#0e3a2a);color:#f5fbe7;border-color:#0d3425;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 20px -14px rgba(13,52,37,.95);
      }
      /* Withdrawal = warm clay */
      .transaction-grid[data-tx-mode="withdrawal"] .segment[data-mode="withdrawal"][aria-pressed="true"]{
        background:linear-gradient(158deg,#c4673c,#9c4526);color:#fff7f0;border-color:#8f3d20;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 20px -14px rgba(140,58,30,.95);
      }
      /* A small lime dot marks the active mode without breaking the pill shape. */
      .transaction-grid .segment[aria-pressed="true"]:before{
        content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
        margin-right:8px;vertical-align:1px;
        background:var(--lime);box-shadow:0 0 0 3px rgba(216,233,138,.25);
      }
      .transaction-grid[data-tx-mode="withdrawal"] .segment[data-mode="withdrawal"][aria-pressed="true"]:before{
        background:#ffd9bf;box-shadow:0 0 0 3px rgba(255,217,191,.28);
      }
      /* The mode reaches the rest of the desk: icon tile, money prefix, button. */
      .transaction-grid[data-tx-mode="deposit"] .card-padding:first-child .metric-icon{
        background:linear-gradient(150deg,#f0f7e0,#e4f0ce);color:#3f7a4c;
      }
      .transaction-grid[data-tx-mode="withdrawal"] .card-padding:first-child .metric-icon{
        background:linear-gradient(150deg,#fbe8dc,#f5dbc9);color:#a5522c;
      }
      .transaction-grid[data-tx-mode="withdrawal"] .money-input>span,.transaction-grid[data-tx-mode="withdrawal"] .money-input .prefix{color:#a5522c}
      .transaction-grid[data-tx-mode="withdrawal"] .money-input .control:focus{border-color:#d29875;box-shadow:0 0 0 3px rgba(214,150,110,.35)}
      .transaction-grid #tx-submit{transition:background .3s ease,box-shadow .3s ease,border-color .3s ease,transform .16s ease}
      .transaction-grid[data-tx-mode="withdrawal"] #tx-submit{
        background:linear-gradient(174deg,#c4673c,#98421f);border-color:#8b3c1c;color:#fff7f0;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -16px rgba(140,58,30,.95);
      }
      .transaction-grid[data-tx-mode="withdrawal"] #tx-submit .icon{color:#ffd9bf}
      .transaction-grid[data-tx-mode="withdrawal"] #tx-submit:hover{background:linear-gradient(174deg,#cf7043,#a2471f)}
      /* And the balance preview picks up the same warm cue. */
      .transaction-grid[data-tx-mode="withdrawal"] .account-hero{
        background:
          radial-gradient(300px 180px at 92% 0%,rgba(244,200,170,.45),transparent 70%),
          linear-gradient(150deg,#fdf2ea,#f9e7da);
        border-color:#f0d7c4;
      }
      .transaction-grid[data-tx-mode="withdrawal"] .account-balance{color:#8f3f20}
      /* ---------- page entrance ---------- */
      @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      #view>*{animation:riseIn .42s cubic-bezier(.22,.68,.32,1) both}
      #view>*:nth-child(2){animation-delay:.05s}
      #view>*:nth-child(3){animation-delay:.09s}
      #view>*:nth-child(4){animation-delay:.13s}
      #view>*:nth-child(n+5){animation-delay:.16s}
      .table-wrap tbody tr{animation:riseIn .32s ease both}
      /* ---------- focus visibility everywhere ---------- */
      a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
        outline:2px solid #86a95c;outline-offset:2px;border-radius:8px;
      }
      /* ---------- motion preferences ---------- */
      @media (prefers-reduced-motion:reduce){
        *{animation:none!important;transition:none!important}
      }
    }

/* ============================================================
   ROUND 18 · COLOUR
   The loan desk now follows the reference board: a clean white
   sidebar, soft white cards with depth, green and gold accents,
   large figures with a real month-on-month line, a labelled bar
   chart, and a clients strip. Every one of those cards is a
   control that opens its own page.
   ============================================================ */
.sidebar{background:#fff;color:#26382e;border-right:1px solid #e9eee6;box-shadow:14px 0 40px rgba(16,56,45,.05)}
.brand-name{color:#0f3d2e}
.brand-sub{color:#b0862c}
.side-label{color:#a2b0a6}
.side-link{color:#455a4d}
.side-link:hover{background:#f1f6ec;color:#0f3d2e}
.side-link[aria-current="page"]{background:linear-gradient(96deg,#1d7a51 0%,#3f9e63 48%,#c9a13a 100%);color:#fff;font-weight:750;box-shadow:0 10px 20px rgba(29,122,81,.26)}
.side-link[aria-current="page"]:before{display:none}
.side-link[aria-current="page"] .icon{color:#fff}
.sidebar-bottom{border-color:#e5ece0;background:#f7faf3}

.local-sub{color:#7e8f83}

/* ---- the four loan-desk cards ---- */
.loan-desk-metrics{grid-template-columns:1.3fr repeat(3,minmax(0,1fr));gap:16px}
.kpi-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;border:1px solid #edf1e8;background:#fff;border-radius:18px;padding:19px 20px 17px;box-shadow:0 12px 28px rgba(16,56,45,.07);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
button.kpi-card{cursor:pointer}
button.kpi-card:hover{transform:translateY(-3px);box-shadow:0 20px 38px rgba(16,56,45,.14);border-color:#dce8d6}
button.kpi-card:active{transform:translateY(-1px)}
.kpi-card:focus-visible{outline:3px solid #7cbb62;outline-offset:3px}
.kpi-top{display:flex;align-items:center;gap:12px;padding-right:30px}
.kpi-chip{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 16px rgba(20,70,45,.18)}
.kpi-chip .icon{width:22px;height:22px}
.kpi-chip.green{background:linear-gradient(140deg,#4bb87c,#12734a)}
.kpi-chip.gold{background:linear-gradient(140deg,#f4cd6a,#c28c1d)}
.kpi-chip.ink{background:linear-gradient(140deg,#4a7d68,#173a2d)}
.kpi-chip.red{background:linear-gradient(140deg,#ef9273,#b8412a)}
.kpi-label{font-size:14.5px;font-weight:750;color:#16281f;letter-spacing:-.2px;line-height:1.2}
.kpi-figure{font-size:30px;line-height:1.1;letter-spacing:-1.3px;font-weight:800;margin:15px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi-figure.green{color:#0f5c3c}
.kpi-figure.gold{color:#a87516}
.kpi-figure.ink{color:#16281f}
.kpi-figure.red{color:#a8331d}

.kpi-trend.up{color:#178a52}
.kpi-trend.down{color:#c2521f}

.kpi-sub{font-size:11.5px;color:#8b9a90;margin-top:5px;line-height:1.35}
.kpi-open{position:absolute;top:15px;right:15px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#a8b8ad;background:#f4f7f1;transition:background .18s ease,color .18s ease,transform .18s ease}

/* ---- the clients strip under the cards ---- */

/* ---- Loans By Month: labelled axis, gridlines, gradient bars ---- */
.chart-title-row h2{letter-spacing:-.6px}
.activity-bars{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.bars-plot.is-axis{padding-left:58px}
.bars-yaxis{position:absolute;left:0;top:10px;width:48px;height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700;color:#93a298;font-variant-numeric:tabular-nums;pointer-events:none}

.bars-grid{height:150px}
.bars-grid span{display:block;border-top:1px dashed #eef2ec}

.bar-pair{height:150px;border-bottom:1.5px solid #dde5d9;gap:5px}
.bar{border-radius:8px 8px 4px 4px;box-shadow:0 6px 12px rgba(16,56,45,.13);width:min(22px,40%)}
.bar-issued{background:linear-gradient(180deg,#7ed296 0%,#1a8b5c 55%,#0f5c3c 100%)}

button.bar-month{border:0;background:transparent;font:inherit;padding:0 2px;border-radius:10px;cursor:pointer;transition:background .16s ease,transform .16s ease}

.bar-month .bar-label{font-size:11px;font-weight:750;color:#5c7164;letter-spacing:.2px}
.bar-month .bar-label small{color:#a3b1a7;font-weight:700}
.bar-month.is-empty{opacity:.7}
.bar-month.is-empty .bar-label{color:#a9b6ac}
.chart-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:10px;font-weight:800;letter-spacing:.9px;color:#0f5c3c;background:#eef7e9;border:1px solid #dcecd3}

/* ---- a shared drill-down shell ---- */
.back-link{display:inline-flex;align-items:center;gap:7px;border:1px solid #e3eae0;background:#fff;color:#3c5346;border-radius:9px;padding:8px 13px;font-size:11.5px;font-weight:700;margin-bottom:14px;box-shadow:0 4px 10px rgba(16,56,45,.05)}
.back-link:hover{border-color:#bcd3ae;color:#0f5c3c;background:#f8fbf5}
.drill-hero{border-radius:20px;padding:24px 26px 22px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:0 18px 36px rgba(16,56,45,.2)}
.drill-hero.green{background:linear-gradient(118deg,#0d5236 0%,#2c9060 58%,#7bcb90 100%)}
.drill-hero.gold{background:linear-gradient(118deg,#7d5410 0%,#c2912a 55%,#f2d283 100%)}
.drill-hero.red{background:linear-gradient(118deg,#6f2010 0%,#bb4527 58%,#f0997c 100%)}
.drill-hero.ink{background:linear-gradient(118deg,#0e241d 0%,#2b5847 56%,#5f9c7d 100%)}
.drill-hero:after{content:"";position:absolute;right:-70px;top:-80px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.drill-hero:before{content:"";position:absolute;right:70px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.drill-eyebrow{font-size:10.5px;letter-spacing:1.7px;font-weight:800;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.drill-figure{font-size:38px;font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin:9px 0 5px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.drill-caption{font-size:12.5px;opacity:.94;position:relative;z-index:1;max-width:62ch;line-height:1.5}
.drill-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px;position:relative;z-index:1}
.drill-chip{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.drill-chip strong{font-weight:800}
.drill-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.drill-stack{display:grid;gap:16px}
.drill-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 21px 14px;border-bottom:1px solid #f0f3ef}
.drill-section-head h2{font-size:14.5px;margin:0;color:#1b3126;letter-spacing:-.2px;font-weight:800}
.drill-section-head p{margin:4px 0 0;font-size:11.5px;color:#8b9a90;line-height:1.4}
.drill-section-head .drill-total{text-align:right;font-size:11px;color:#8b9a90;white-space:nowrap}
.drill-section-head .drill-total strong{display:block;font-size:16px;color:#0f5c3c;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.drill-section-head .drill-total.gold strong{color:#a87516}
.drill-section-head .drill-total.red strong{color:#a8331d}
.data-table tfoot td{background:#f7faf4;border-top:2px solid #e2ebdd;border-bottom:0;font-size:11px;font-weight:800;color:#17392b;font-variant-numeric:tabular-nums}
.data-table tfoot td.amount{color:#0f5c3c}
.drill-note{font-size:11px;color:#8b9a90;margin:12px 21px 16px;line-height:1.55}
.btn-sms{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:800;color:#5d4008;background:linear-gradient(135deg,#f8dd93,#e0ad33);box-shadow:0 6px 14px rgba(190,140,28,.28);white-space:nowrap}
.btn-sms:hover{filter:brightness(1.05)}
.btn-sms:disabled{opacity:.6;box-shadow:none}
.btn-sms .icon{width:13px;height:13px}
.btn-sms-bulk{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1d7a51,#2f9e68);box-shadow:0 10px 20px rgba(29,122,81,.26)}
.btn-sms-bulk:hover{filter:brightness(1.05)}
.month-nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.month-nav button{display:inline-flex;align-items:center;gap:7px;border:1px solid #e3eae0;background:#fff;color:#3c5346;border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:700}
.month-nav button:hover{border-color:#bcd3ae;color:#0f5c3c;background:#f8fbf5}
.month-nav .is-current{background:linear-gradient(96deg,#1d7a51,#3f9e63);color:#fff;border-color:transparent}
.drill-empty{padding:26px 21px;color:#8b9a90;font-size:12px;text-align:center}
@media(max-width:1000px){.drill-split{grid-template-columns:1fr}}
@media(max-width:760px){.kpi-figure{font-size:26px}.kpi-figure.money{font-size:22px}.drill-figure{font-size:30px}}

/* ---- clickable mini-stat cards (clients, loans portal, repayments) ---- */
button.mini-stat{font:inherit;text-align:left;width:100%;display:block;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;position:relative}
.mini-stat-link .label,.mini-stat-link .value{display:block}
button.mini-stat.mini-stat-link:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(16,56,45,.12);border-color:#d8e6cf}
button.mini-stat.mini-stat-link:focus-visible{outline:3px solid #7cbb62;outline-offset:3px}
.mini-stat-link .mini-open{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;font-weight:800;letter-spacing:.2px;color:#1d7a51}
.mini-stat-link:hover .mini-open{color:#0f5c3c}
.mini-stat-link .mini-open .icon{width:11px;height:11px}
.mini-stats.loan-stats .mini-stat{background:linear-gradient(180deg,#fbfdf9,#fff)}

/* ============================================================
   ROUND 18 · AUDIT SHEET
   The entries stay exactly as they were. The totals line now
   closes the table, and the report notes and the printed footer
   are pushed to the bottom of the sheet instead of sitting in the
   middle of it under the last row.
   ============================================================ */
.audit-report-paper{display:flex;flex-direction:column;min-height:270mm}
.audit-report-table tfoot td{background:#f4f9f3;border-top:2px solid #d9e8d9;border-bottom:0;font-weight:800;color:#1d3f2c;font-size:10.5px;padding:9px 6px}
.audit-report-table tfoot td.ar-amount{font-size:13.5px;color:#123f2a;text-align:right;white-space:nowrap}
.audit-report-table tfoot td small{display:block;font-weight:600;color:#6d8375;font-size:9px;line-height:1.4;margin-top:3px}
.ar-end{margin-top:auto}
@media print{
  /* The sheet itself is a column that fills the printable page, so the notes
     and the printed footer settle on the bottom edge of the sheet, not under
     the last row in the middle of it. */
  #print-root .audit-report-paper{display:flex!important;flex-direction:column;min-height:calc(297mm - 26mm)!important}
  #print-root .ar-end{margin-top:auto}
  /* The totals row prints once, at the end of the entries, never repeated. */
  #print-root .audit-report-table tfoot{display:table-row-group}
}

.loan-desk-grid{grid-template-columns:1.95fr 1fr}

<script>
(() => {
  'use strict';
  /* ============================================================
     SIKA LOCAL-FIRST REPOSITORY (schema v3)
     All money is integer pesewas. Reads and writes pass through this
     boundary, which is the seam for a future secure server API.
     The old v1 storage key is retained and v1 records are migrated
     in memory without erasing them. This is NOT a banking backend.
     ============================================================ */
  /* Two separate workspaces share one engine. The savings-and-loans workspace is
     the product now and starts clean; the earlier bank workspace is untouched in
     its own storage key and stays reachable from Data & settings. */
  const WORKSPACE_MODE_KEY = 'sika.workspace.mode';
  const WORKSPACE_KEYS = Object.freeze({snl:'sika.snl.workspace.v1',bank:'sika.agency.workspace.v1'});
  let workspaceMode = (() => { try { return localStorage.getItem(WORKSPACE_MODE_KEY)==='bank'?'bank':'snl'; } catch(_) { return 'snl'; } })();
  let STORAGE_KEY = WORKSPACE_KEYS[workspaceMode];
  let LOCK_NAME = `${STORAGE_KEY}.write`;
  const isSnl = () => workspaceMode==='snl';
  /* Wording that follows the selected workspace. */
  const WORDS = {snl:{held:'Out on loan',save:'Repayment collected',take:'Loan issued',ledger:'Repayments ledger',ledgerShort:'Repayments ledger',activity:'Loan activity',desk:'Loan desk',book:'Loan book'},bank:{held:'Total vault balance',save:'Deposit',take:'Withdrawal / debit',ledger:'Transaction ledger',ledgerShort:'Transaction ledger',activity:'Account activity',desk:'Dashboard',book:'Active loans'}};
  const words = () => WORDS[workspaceMode];
  const MAX_AMOUNT = 100000000000; // GH₵1 billion per entry
  const MAX_RATE = 10000;          // 100.00% per year
  const MAX_MONTHS = 36000;        // 360.00 months = 30 years
  /* The product catalogue is declared before anything else runs: a saved
     workspace is validated during startup, and that check reads these values.
     Declaring them later leaves them in the temporal dead zone and a stored
     loan would look unreadable. */
  const LOAN_PRODUCTS = Object.freeze({
    group:Object.freeze({
      label:'Group loan',
      blurb:'Market women, traders and associations. The group stands behind one loan.',
      types:Object.freeze([
        Object.freeze({key:'group-market',label:'Market Queens Group Loan',rhythm:'weekly',note:'Market traders · collected weekly'}),
        Object.freeze({key:'group-farmers',label:'Farmers Group Loan',rhythm:'monthly',note:'Farming groups · collected monthly'}),
        Object.freeze({key:'group-youth',label:'Youth / Apprentice Group Loan',rhythm:'weekly',note:'Young entrepreneurs · collected weekly'})
      ])
    }),
    individual:Object.freeze({
      label:'Individual loan',
      blurb:'One person who does not want a group. The borrower signs alone.',
      types:Object.freeze([
        Object.freeze({key:'individual-business',label:'Business Loan',rhythm:'monthly',note:'To expand a shop or business'}),
        Object.freeze({key:'individual-salary',label:'Salary Worker Loan',rhythm:'monthly',note:'Government and private workers'}),
        Object.freeze({key:'individual-emergency',label:'Emergency Loan',rhythm:'weekly',note:'Quick loan for an urgent need'})
      ])
    }),
    special:Object.freeze({
      label:'Special loan',
      blurb:'Extra products for savings-backed, asset, school and funeral needs.',
      types:Object.freeze([

  let dashboardTodayPage=0,dashboardRenderedDay='';
  function todayAuditEntries(events,day=todayGhana()){

  function loanDaysLate(dueDate,day=todayGhana()){
    if(!validDay(dueDate)||dueDate>=day)return 0;

  /* Every total is accumulated in BigInt pesewas: no floating point ever touches

  function loanDeskStats(){
    const active=activeLoans(),today=todayGhana();
    let totalIssued=0n,totalContracted=0n,collected=0n,overdueCount=0,overdueAmount=0n,paidCount=0,installmentCount=0;
    const open=[];
    for(const loan of active){
      totalIssued+=BigInt(loan.principalPesewas);totalContracted+=BigInt(loan.totalRepaymentPesewas);
      for(const item of loan.schedule||[]){
        installmentCount++;
        if(item.paidAt){collected+=BigInt(item.amountPesewas);paidCount++;}
        else{open.push({loan,item});if(item.dueDate<today){overdueCount++;overdueAmount+=BigInt(item.amountPesewas);}}
      }
    }
    open.sort((a,b)=>a.item.dueDate.localeCompare(b.item.dueDate));
    const seen=new Set(),nextDue=[];
    for(const row of open){if(seen.has(row.loan.id))continue;seen.add(row.loan.id);nextDue.push(row);}
    return {active,today,issued:totalIssued,contracted:totalContracted,collected,outstanding:totalContracted-collected,overdueCount,overdueAmount,paidCount,installmentCount,open,nextDue};
  }
  function loanDeskTable(rows,{limit=8}={}){

  /* Six months of repayments actually recorded, scaled to the best month. */
  function repaymentBars(){

      buckets.set(key,{key,collected:0n,count:0});

  /* ============================================================

  /* Hundredths of a percent, rounded half-up in BigInt. Two shares derived from
     it always add up to exactly 100.00%. */
  function shareHundredths(part,total){
    const p=BigInt(part??0),t=BigInt(total??0);

    let issued=0n,contracted=0n,collected=0n,paidCount=0,installmentCount=0;
    for(const loan of loans){
      issued+=BigInt(loan.principalPesewas||0);contracted+=BigInt(loan.totalRepaymentPesewas||0);
      for(const item of loan.schedule||[]){installmentCount++;if(item.paidAt){collected+=BigInt(item.amountPesewas);paidCount++;}}

    return {issued,contracted,collected,outstanding:contracted-collected,paidCount,installmentCount};

  /* Every repayment actually collected, newest first, with the loan it settles. */
  function repaymentRows(source=state){
    const rows=[];
    for(const loan of source.loans){
      if(loan.status!=='active')continue;
      const customer=customerById(loan.customerId,source);if(!customer)continue;
      for(const item of loan.schedule||[])if(item.paidAt)rows.push({loan,item,customer});
    }

  }
  function repaymentsFor(customerId,source=state){return repaymentRows(source).filter(row=>row.customer.id===customerId);}
  function loansFor(customerId,source=state){return source.loans.filter(loan=>loan.customerId===customerId&&loan.status==='active');}
  /* Six monthly buckets of money lent out against money collected back. */
  function loanMonthBuckets(loans,now=new Date()){
    const buckets=new Map();
    for(let index=5;index>=0;index--){
      const d=new Date(now.getFullYear(),now.getMonth()-index,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      buckets.set(key,{key,issued:0n,repaid:0n,loans:0,repayments:0});
    }
    for(const loan of loans){
      if(loan.status==='active'&&loan.approvedAt){
        const bucket=buckets.get(dateInGhana(new Date(loan.approvedAt)).slice(0,7));
        if(bucket){bucket.issued+=BigInt(loan.principalPesewas);bucket.loans++;}
      }
      for(const item of loan.schedule||[])if(item.paidAt){
        const bucket=buckets.get(dateInGhana(new Date(item.paidAt)).slice(0,7));

  /* A short, round axis label: 0, 12k, 1.4m — always in cedis. */
  function compactCedis(value){
    const v=Number(value);
    if(!v)return 'GHS 0';
    const cedis=v/100;
    if(cedis>=1000000)return `GHS ${(Math.round(cedis/10000)/100).toLocaleString('en-GH')}m`;
    if(cedis>=1000)return `GHS ${(Math.round(cedis/100)/10).toLocaleString('en-GH')}k`;
    return `GHS ${Math.round(cedis).toLocaleString('en-GH')}`;
  }
  /* An axis that ends on a round number, so the gridlines read 30k, 20k, 10k. */
  function niceAxisTop(peak){
    const top=BigInt(peak);
    if(top<=0n)return 0n;
    /* The axis ends on a round number, and a quarter of it is round too, so the
       five gridlines always read cleanly: 40k, 30k, 20k, 10k, 0. */
    const quarter=(top+3n)/4n;
    const digits=quarter.toString().length;
    const magnitude=10n**BigInt(Math.max(0,digits-1));
    let step=magnitude;
    for(const factor of [10n,20n,25n,50n,100n]){
      const candidate=magnitude*factor/10n;
      if(candidate>=quarter){step=candidate;break;}
      step=candidate;
    }
    return step*4n;
  }
  /* Loans By Month. Every month is a button: selecting one opens that month in

  function loanMonthBars(loans){

    let peak=0n;
    for(const bucket of list){if(bucket.issued>peak)peak=bucket.issued;if(bucket.repaid>peak)peak=bucket.repaid;}
    const axisTop=niceAxisTop(peak);

    const summary=list.map(b=>`${MONTH_SHORT[Number(b.key.slice(5,7))-1]} ${b.key.slice(0,4)}: issued ${money(b.issued)}, repaid ${money(b.repaid)}`).join('; ');
    const step=axisTop/4n;

  }
  /* The pie the business actually needs: money out on loans against money

  function loansPie(loans,{caption='Loans issued & loans paid',interactive=false,subtitle='Lent out against collected back · all time'}={}){

    }else if(paid===0n){

  /* ============================================================
     ROUND 18 · DRILL-DOWN PAGES
     Every card on the loan desk, the clients strip, the loans

  /* A month-on-month line: how this month compares with the one before. */
  function monthChange(current,previous){
    const cur=BigInt(current??0),prev=BigInt(previous??0);
    if(prev===0n&&cur===0n)return {dir:'flat',arrow:'·',text:'Nothing recorded in either month'};
    if(prev===0n)return {dir:'up',arrow:'↑',text:'New this month'};
    if(cur===prev)return {dir:'flat',arrow:'·',text:'Same as last month'};
    /* Percent to two decimals, worked out in BigInt so no floating point
       touches a money comparison. hundredths = percent × 100. */
    const hundredths=(cur-prev)*10000n/(prev<0n?-prev:prev);
    const percent=Number(hundredths)/100;
    return cur>prev
      ? {dir:'up',arrow:'↑',text:`+${percent.toFixed(2)}% from last month`}
      : {dir:'down',arrow:'↓',text:`−${Math.abs(percent).toFixed(2)}% from last month`};

  /* Every client who still owes money, with the loans behind the figure. */
  function clientsStillOwing({onlyBorrowers=true}={}){

      list.push({customer,loans,totals});

    list.sort((a,b)=>(b.totals.outstanding>a.totals.outstanding?1:b.totals.outstanding<a.totals.outstanding?-1:fullName(a.customer).localeCompare(fullName(b.customer))));

  /* What a month holds: loans approved in it and repayments collected in it. */
  function monthActivity(key){
    const inMonth=value=>validDay(value)?dateInGhana(new Date(value)).slice(0,7)===key:false;
    const loansIn=[],repaymentsIn=[];
    for(const loan of state.loans){
      if(loan.status==='active'&&inMonth(loan.approvedAt))loansIn.push(loan);
      for(const item of loan.schedule||[])if(item.paidAt&&inMonth(item.paidAt))repaymentsIn.push({loan,item,customer:customerById(loan.customerId)});
    }
    let issued=0n,repaid=0n;
    for(const loan of loansIn)issued+=BigInt(loan.principalPesewas||0);

  /* ---- 2. Still to collect: everyone still owing, loan by loan ---- */
  function drillStillToCollectPage(){

  /* ---- 3. Collected this month: paid, and still to pay ---- */
  function drillCollectedThisMonthPage(){

      const customer=customerById(loan.customerId);if(!customer)continue;
      for(const item of loan.schedule||[]){

        if(!item.paidAt&&item.dueDate.slice(0,7)===key)unpaid.push({loan,item,customer});

  /* This month against last month, so each card can carry a real trend line
     instead of a decorative arrow. */
  function loanDeskMonthly(){
    const thisKey=todayGhana().slice(0,7),lastKey=shiftMonthKey(thisKey,-1);
    let issuedThis=0n,issuedLast=0n,collectedThis=0n,collectedLast=0n,newLoansThis=0,newLoansLast=0,newClientsThis=0;
    for(const loan of state.loans){
      if(loan.status==='active'&&loan.approvedAt){
        const key=dateInGhana(new Date(loan.approvedAt)).slice(0,7);
        if(key===thisKey){issuedThis+=BigInt(loan.principalPesewas||0);newLoansThis++;}
        else if(key===lastKey){issuedLast+=BigInt(loan.principalPesewas||0);newLoansLast++;}
      }
      for(const item of loan.schedule||[])if(item.paidAt){
        const key=dateInGhana(new Date(item.paidAt)).slice(0,7);
        if(key===thisKey)collectedThis+=BigInt(item.amountPesewas||0);
        else if(key===lastKey)collectedLast+=BigInt(item.amountPesewas||0);
      }
    }
    for(const customer of state.customers)if(customer.createdAt&&dateInGhana(new Date(customer.createdAt)).slice(0,7)===thisKey)newClientsThis++;
    return {thisKey,lastKey,issuedThis,issuedLast,collectedThis,collectedLast,newLoansThis,newLoansLast,newClientsThis};
  }

  function loanClientTable(customers,query){

    };
    return `<div class="table-wrap" tabindex="0" role="region" aria-label="Scroll sideways to see all table columns and amounts"><table class="data-table"><thead><tr><th>Client</th><th>Account number</th><th>Amount taken</th><th>Amount paid</th><th>Balance owed</th><th>Added</th><th></th></tr></thead><tbody>${customers.map(row).join('')}</tbody></table></div>`;
  }
  function customerTable() {
    const query=searchCustomers.trim().toLocaleLowerCase(),{balances}=ledgerSnapshot();
    const customers=state.customers.filter(c=>[fullName(c),c.accountNumber,c.ghanaCard,...c.phones,c.location].join(' ').toLocaleLowerCase().includes(query)).slice().reverse();

tle">Search and manage customer profiles</p></div><span class="badge badge-grey">${esc(countLabel(state.customers.length,'client'))}</span></div><div class="toolbar"><div class="search-field">${svg('search')}<input class="control" id="customers-search" type="search" value="${esc(searchCustomers)}" placeholder="Search name, account, phone or Ghana Card" aria-label="Search clients"></div></div><div id="customers-table">${customerTable()}</div></section>`;

  function renderLookup(prefix) {
    const input=$(`#${prefix}-lookup`),menu=$(`#${prefix}-results`); if(!input||!menu)return;
    const query=input.value.trim().toLocaleLowerCase();
    /* An empty box still shows the clients, newest first, so the list is there
       before the first letter is typed. */
    const matches=(query?state.customers.filter(c=>[fullName(c),c.accountNumber,...c.phones,c.ghanaCard,c.occupation].join(' ').toLocaleLowerCase().includes(query)):state.customers.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))).slice(0,12);
    if(!matches.length&&!query){menu.hidden=true;input.setAttribute('aria-expanded','false');lookupIndexes[prefix]=-1;return;}
    if(lookupIndexes[prefix]>=matches.length)lookupIndexes[prefix]=matches.length-1;
    menu.innerHTML=matches.length?matches.map((c,index)=>`<button type="button" class="lookup-option" role="option" id="${prefix}-option-${index}" aria-selected="${index===lookupIndexes[prefix]}" data-action="select-customer" data-prefix="${prefix}" data-id="${esc(c.id)}">${avatar(c)}<span class="lookup-option-text"><strong>${esc(fullName(c))}${sampleBadge(c)}</strong><small>${esc(phoneList(c))}</small><small class="lookup-option-card">${esc(c.ghanaCard)} · ${esc(c.location||'No location')}</small></span></button>`).join(''):`<div class="lookup-empty">No matching clients found.</div>`;
    menu.hidden=false;input.setAttribute('aria-expanded','true');
    if(lookupIndexes[prefix]>=0) input.setAttribute('aria-activedescendant',`${prefix}-option-${lookupIndexes[prefix]}`); else input.removeAttribute('aria-activedescendant');
  }
  function selectLookup(prefix,id) {
    const c=customerById(id),input=$(`#${prefix}-lookup`),hidden=$(`#${prefix}-customer`),menu=$(`#${prefix}-results`); if(!c||!input||!hidden)return;
    hidden.value=c.id;input.value=fullName(c);setError(input,'');menu.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');lookupIndexes[prefix]=-1;
    $(`#${prefix}-selection`).textContent=`Selected: ${phoneList(c)}`;if(prefix==='tx')updateAccountPreview();if(prefix==='loan')updateLoanClientCard();
  }
  function refreshLookup(prefix) {
    const hidden=$(`#${prefix}-customer`),input=$(`#${prefix}-lookup`);if(!hidden||!input)return;
    if(hidden.value&&!customerById(hidden.value)){hidden.value='';input.value='';$(`#${prefix}-selection`).textContent='Start typing, then select a client from the results.';}
    else if(!hidden.value&&input.value.trim())renderLookup(prefix);

  function selectedAccount(customerId,rawAmount,mode) {
    const c=customerById(customerId);
    if(!c)return `<div class="account-hero"><div class="empty-state compact" style="padding:18px 10px"><div class="empty-icon" style="background:#e7f0e1">${svg('wallet')}</div><strong>No client selected</strong><p style="margin-bottom:0">Choose a client to see their current balance and a preview of this transaction.</p></div></div>`;
    const snapshot=ledgerSnapshot(),balance=snapshot.balances.get(c.id)||0,amount=parseFixed2(rawAmount,MAX_AMOUNT),after=amount===null?null:BigInt(balance)+(mode==='deposit'?BigInt(amount):-BigInt(amount));
    const tooLarge=amount!==null&&mode==='deposit'&&(after>BigInt(Number.MAX_SAFE_INTEGER)||BigInt(snapshot.vault)+BigInt(amount)>BigInt(Number.MAX_SAFE_INTEGER));
    return `<div class="account-hero"><div class="account-head">${avatar(c)}<div><div class="account-title">${esc(fullName(c))}${sampleBadge(c)}</div><div class="account-meta">${esc(phoneList(c))}</div></div></div><div class="account-balance-label">${isSnl()?'Savings balance':'Current balance'}</div><div class="account-balance">${esc(money(balance))}</div><div class="balance-preview"><span>Balance after ${mode==='deposit'?(isSnl()?'savings deposit':'deposit'):'withdrawal'}</span><strong class="${after!==null&&(after<0n||tooLarge)?'error':''}">${after===null?'—':after<0n?'Insufficient funds':tooLarge?'Exceeds supported limit':esc(money(after))}</strong></div></div>`;

)}<span>Every confirmed transaction is added to the ledger immediately.</span></div></div></section></div><section class="panel spaced-panel"><div class="panel-header"><div><h2 class="panel-title">Recent transactions</h2><p class="panel-subtitle">The five most recent movements. The complete record is on the transaction ledger page.</p></div>${button('navigate','View full ledger','arrow-right','secondary','data-view="ledger"')}</div>${transactionTable(ledgerSnapshot().rows.slice().reverse().slice(0,5),{showAction:true})}</section>`;

  /* The ledger is a page of its own: search, type filter, totals and paging,
     with no recording form, so the deposit / debit desk stays a desk. */
  const LEDGER_PAGE_SIZE=20;
  function ledgerTotals(rows){
    let deposits=0,withdrawals=0;
    for(const tx of rows){if(tx.type==='deposit')deposits+=tx.amountPesewas;else withdrawals+=tx.amountPesewas;}
    return {count:rows.length,deposits,withdrawals};
  }
  function ledgerTableHtml(){
    const rows=filteredLedger(),filtered=!!searchTransactions||transactionFilter!=='all';
    if(!rows.length)return transactionTable([],{filtered,showAction:true});
    const pages=Math.max(1,Math.ceil(rows.length/LEDGER_PAGE_SIZE));
    ledgerPageNumber=Math.min(Math.max(0,ledgerPageNumber),pages-1);
    const start=ledgerPageNumber*LEDGER_PAGE_SIZE,shown=rows.slice(start,start+LEDGER_PAGE_SIZE);
    const range=`Showing ${start+1}–${start+shown.length} of ${rows.length.toLocaleString('en-GH')} ${rows.length===1?'transaction':'transactions'}`;
    return `${transactionTable(shown,{filtered})}<div class="schedule-pagination"><span>${esc(range)}</span><div><button type="button" class="btn btn-secondary btn-small" data-action="ledger-prev" ${start===0?'disabled':''}>Previous</button> <button type="button" class="btn btn-secondary btn-small" data-action="ledger-next" ${start+shown.length>=rows.length?'disabled':''}>Next</button></div></div>`;
  }
  function ledgerStatsHtml(){
    const totals=ledgerTotals(filteredLedger()),filtered=!!searchTransactions||transactionFilter!=='all';
    return `<div class="mini-stat"><div class="label">${filtered?'Matching rows':'Total rows'}</div><div class="value">${totals.count.toLocaleString('en-GH')}</div></div><div class="mini-stat"><div class="label">${filtered?'Deposits shown':'Deposits'}</div><div class="value">${moneyHTML(totals.deposits)}</div></div><div class="mini-stat"><div class="label">${filtered?'Withdrawals shown':'Withdrawals'}</div><div class="value">${moneyHTML(totals.withdrawals)}</div></div>`;
  }
  function ledgerCountLabel(){
    const rows=filteredLedger();
